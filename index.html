// ── Utilitários ───────────────────────────────────────────────────────────────
const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
const rng   = (lo, hi) => lo + Math.random() * (hi - lo);
const hits  = (a, b) =>
  a.x < b.x + b.w && a.x + a.w > b.x &&
  a.y < b.y + b.h && a.y + a.h > b.y;

// ── Classes ───────────────────────────────────────────────────────────────────
class Player {
  constructor(x, y) {
    this.x = x;   this.y = y;
    this.w = 24;  this.h = 40;
    this.vx = 0;  this.vy = 0;
    this.onGround = false;
    this.facing = 1;
    this.hp = 3;
    this.inv = 0;          // frames de invencibilidade
    this.dead = false;
    this.won  = false;
    this.keys = 0;
    this.tick = 0;
  }
  get rect() { return {x:this.x, y:this.y, w:this.w, h:this.h}; }

  update(plats) {
    if (this.dead) return;
    this.vy = Math.min(this.vy + GRAVITY, 22);

    // Eixo X
    this.x += this.vx;
    for (const p of plats) {
      if (hits(this.rect, p)) {
        if (this.vx > 0) this.x = p.x - this.w;
        else             this.x = p.x + p.w;
        this.vx = 0;
      }
    }

    // Eixo Y
    this.y += this.vy;
    this.onGround = false;
    for (const p of plats) {
      if (hits(this.rect, p)) {
        if (this.vy >= 0) { this.y = p.y - this.h; this.onGround = true; }
        else              { this.y = p.y + p.h; }
        this.vy = 0;
      }
    }

    this.x = clamp(this.x, 0, WORLD_W - this.w);
    if (this.y > WORLD_H) this.hurt();
    if (this.inv > 0) this.inv--;
    this.tick++;
  }

  jump() { if (this.onGround) this.vy = JUMP_POWER; }

  hurt() {
    if (this.inv > 0) return;
    this.hp--;
    this.inv = 95;
    this.x = 50; this.y = 490;
    this.vx = 0; this.vy = 0;
    if (this.hp <= 0) this.dead = true;
  }

  torchScreen(cx, cy) {
    return {
      x: this.x - cx + this.w / 2 + this.facing * 16,
      y: this.y - cy + 18,
    };
  }

  draw(ctx, cx, cy) {
    if (this.dead) return;
    if (this.inv > 0 && Math.floor(this.tick / 5) % 2 === 1) return;

    const sx = Math.floor(this.x - cx);
    const sy = Math.floor(this.y - cy);
    const leg = this.vx !== 0 ? Math.sin(this.tick * 0.22) * 4 : 0;

    // Pernas
    ctx.fillStyle = '#2e1d3e';
    ctx.fillRect(sx + 4,  sy + 36, 8, 6 + leg);
    ctx.fillRect(sx + 12, sy + 36, 8, 6 - leg);
    // Corpo
    ctx.fillStyle = '#3f2558';
    ctx.fillRect(sx + 3, sy + 16, 18, 22);
    // Capa / ombros
    ctx.fillStyle = '#2c1842';
    ctx.fillRect(sx + 1, sy + 16, 22, 7);
    // Cabeça
    ctx.fillStyle = '#c3a080';
    ctx.fillRect(sx + 4, sy + 3, 16, 14);
    // Capuz
    ctx.fillStyle = '#2c1842';
    ctx.fillRect(sx + 2, sy + 1, 20, 9);
    ctx.fillRect(sx + 4, sy + 9, 16, 5);
    // Olho
    ctx.fillStyle = '#0f0818';
    const ex = this.facing === 1 ? sx + 14 : sx + 6;
    ctx.fillRect(ex, sy + 8, 3, 3);

    // --- Tocha ---
    const tx = this.facing === 1 ? sx + this.w + 1 : sx - 7;
    const ty = sy + 14;
    const w1 = Math.sin(this.tick * 0.28) * 3;
    const w2 = Math.sin(this.tick * 0.35) * 3;

    // Cabo de madeira
    ctx.fillStyle = '#6b4020';
    ctx.fillRect(tx, ty + 4, 4, 17);
    // Brasa no topo do cabo
    ctx.fillStyle = '#ff8000';
    ctx.fillRect(tx - 1, ty + 2, 6, 5);

    // Chama externa
    ctx.beginPath();
    ctx.moveTo(tx + 2, ty + 5);
    ctx.lineTo(tx - 4 + w1, ty - 8);
    ctx.lineTo(tx + 2, ty - 1);
    ctx.lineTo(tx + 8 + w2, ty - 8);
    ctx.closePath();
    ctx.fillStyle = '#ffce38';
    ctx.fill();

    // Chama interna
    ctx.beginPath();
    ctx.moveTo(tx + 2, ty + 3);
    ctx.lineTo(tx + w1 * 0.5, ty - 3);
    ctx.lineTo(tx + 4 + w2 * 0.5, ty - 3);
    ctx.closePath();
    ctx.fillStyle = '#ff5a00';
    ctx.fill();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
class Ghost {
  constructor(x, y, patrol) {
    this.x = x; this.y = y;
    this.bx = x; this.by = y;
    this.w = 34; this.h = 40;
    this.patrol = patrol;
    this.speed = rng(0.8, 1.5);
    this.dir = 1;
    this.t = rng(0, 120);
    this.alive = true;
  }
  get rect() { return {x:this.x, y:this.y, w:this.w, h:this.h}; }
  update() {
    this.x += this.speed * this.dir;
    if (this.x > this.bx + this.patrol) this.dir = -1;
    else if (this.x < this.bx)          this.dir =  1;
    this.y = this.by + Math.sin(this.t * 0.045) * 10;
    this.t++;
  }
  draw(ctx, cx, cy) {
    if (!this.alive) return;
    const sx = Math.floor(this.x - cx);
    const sy = Math.floor(this.y - cy);
    if (sx < -60 || sx > SW + 60) return;

    ctx.save();
    ctx.globalAlpha = 0.78 + Math.sin(this.t * 0.07) * 0.12;

    // Glow
    ctx.shadowColor = 'rgba(160, 210, 230, 0.9)';
    ctx.shadowBlur = 22;

    // Corpo
    ctx.fillStyle = '#a0d3e8';
    ctx.beginPath();
    ctx.ellipse(sx + 17, sy + 14, 17, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cauda ondulada
    for (let i = 0; i < 3; i++) {
      const wv = Math.sin(this.t * 0.12 + i * 2.1) * 5;
      ctx.beginPath();
      ctx.ellipse(sx + i * 12 + 6, sy + 27 + wv, 8, 9, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.shadowBlur = 0;

    // Outline brilhante
    ctx.strokeStyle = 'rgba(210, 248, 255, 0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(sx + 17, sy + 14, 17, 14, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Olhos vazados
    ctx.fillStyle = 'rgba(15, 5, 30, 0.92)';
    ctx.beginPath(); ctx.ellipse(sx + 9,  sy + 13, 4.5, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sx + 24, sy + 13, 4.5, 6, 0, 0, Math.PI * 2); ctx.fill();

    // Brilho dos olhos (almas presas)
    ctx.fillStyle = 'rgba(80, 0, 120, 0.6)';
    ctx.beginPath(); ctx.arc(sx + 9,  sy + 13, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 24, sy + 13, 2, 0, Math.PI * 2); ctx.fill();

    // Gotas de sangue
    ctx.fillStyle = 'rgba(190, 10, 10, 0.85)';
    ctx.beginPath(); ctx.arc(sx + 10, sy + 29, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 24, sy + 25, 2.5, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
class Bat {
  constructor(x, y, patrol) {
    this.bx = x; this.by = y;
    this.x = x; this.y = y;
    this.w = 32; this.h = 20;
    this.patrol = patrol;
    this.angle = rng(0, Math.PI * 2);
    this.t = rng(0, 60);
    this.alive = true;
  }
  get rect() { return {x:this.x, y:this.y, w:this.w, h:this.h}; }
  update() {
    this.angle += 0.028;
    this.x = this.bx + Math.cos(this.angle) * this.patrol * 0.5;
    this.y = this.by + Math.sin(this.angle * 1.4) * 55;
    this.t++;
  }
  draw(ctx, cx, cy) {
    if (!this.alive) return;
    const sx = Math.floor(this.x - cx);
    const sy = Math.floor(this.y - cy);
    if (sx < -60 || sx > SW + 60) return;

    const flap = Math.sin(this.t * 0.28) * 7;

    ctx.save();
    ctx.shadowColor = 'rgba(110, 55, 150, 0.6)';
    ctx.shadowBlur = 10;

    // Asas
    ctx.fillStyle = '#4e2868';
    ctx.beginPath();
    ctx.moveTo(sx + 10, sy + 11);
    ctx.lineTo(sx - 4,  sy + flap);
    ctx.lineTo(sx + 2,  sy + 18);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx + 22, sy + 11);
    ctx.lineTo(sx + 36, sy + flap);
    ctx.lineTo(sx + 30, sy + 18);
    ctx.closePath();
    ctx.fill();

    // Corpo
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#301845';
    ctx.beginPath();
    ctx.ellipse(sx + 16, sy + 11, 8, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Orelhas
    ctx.fillStyle = '#4e2868';
    ctx.beginPath();
    ctx.moveTo(sx + 11, sy + 6); ctx.lineTo(sx + 8,  sy - 3); ctx.lineTo(sx + 14, sy + 4); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx + 21, sy + 6); ctx.lineTo(sx + 24, sy - 3); ctx.lineTo(sx + 18, sy + 4); ctx.fill();

    // Olhos vermelhos
    ctx.fillStyle = '#ee1111';
    ctx.beginPath(); ctx.arc(sx + 13, sy + 9, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 19, sy + 9, 2.5, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
class KeyItem {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.collected = false;
    this.t = rng(0, 60);
  }
  draw(ctx, cx, cy) {
    if (this.collected) return;
    this.t++;
    const sx = Math.floor(this.x - cx);
    const sy = Math.floor(this.y - cy + Math.sin(this.t * 0.07) * 5);
    if (sx < -40 || sx > SW + 40) return;

    ctx.save();
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = '#ffcd37';
    ctx.fillStyle   = '#ffcd37';
    ctx.lineWidth   = 3;

    // Argola
    ctx.beginPath();
    ctx.arc(sx, sy, 10, 0, Math.PI * 2);
    ctx.stroke();

    // Cabo
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(sx + 2, sy + 4);
    ctx.lineTo(sx + 18, sy + 4);
    ctx.stroke();

    // Dentes
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx + 14, sy + 4); ctx.lineTo(sx + 14, sy + 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + 10, sy + 4); ctx.lineTo(sx + 10, sy + 8); ctx.stroke();

    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
class Spark {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = rng(-2.2, 2.2);
    this.vy = rng(-3.0, -0.5);
    this.life = (rng(14, 30)) | 0;
    this.maxLife = this.life;
    this.size = rng(1.5, 3.5);
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.09; this.vx *= 0.97;
    this.life--;
  }
  draw(ctx, cx, cy) {
    const t = this.life / this.maxLife;
    ctx.globalAlpha = t * 0.9;
    ctx.fillStyle = `rgb(255,${(80 + 120 * t) | 0},0)`;
    ctx.beginPath();
    ctx.arc(this.x - cx, this.y - cy, Math.max(0.5, this.size * t), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ── Sistema de Áudio (Web Audio API – Procedural) ────────────────────────────
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let audioStarted = false;
let droneGain = null, flameGain = null;

function createNoiseBuffer(sec) {
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * sec | 0, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function startDrone() {
  const osc    = audioCtx.createOscillator();
  const filter = audioCtx.createBiquadFilter();
  const gain   = audioCtx.createGain();
  const lfo    = audioCtx.createOscillator();
  const lfoG   = audioCtx.createGain();

  lfo.frequency.setValueAtTime(0.25, audioCtx.currentTime);
  lfoG.gain.setValueAtTime(6, audioCtx.currentTime);
  lfo.connect(lfoG); lfoG.connect(osc.frequency); lfo.start();

  osc.type = 'sawtooth';
  osc.frequency.setValueAtTime(55, audioCtx.currentTime);
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(220, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.07, audioCtx.currentTime + 1.5);

  osc.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  osc.start();
  droneGain = { gain, osc, lfo };
}

function startFlame() {
  const src    = audioCtx.createBufferSource();
  src.buffer   = createNoiseBuffer(2);
  src.loop     = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type  = 'bandpass';
  filter.frequency.setValueAtTime(900, audioCtx.currentTime);
  filter.Q.setValueAtTime(0.4, audioCtx.currentTime);
  const gain   = audioCtx.createGain();
  gain.gain.setValueAtTime(0.001, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.05, audioCtx.currentTime + 1.5);

  src.connect(filter); filter.connect(gain); gain.connect(audioCtx.destination);
  src.start();
  flameGain = { gain, src };
}

// ── Sons de Proximidade (fantasmas e morcegos) ────────────────────────────────
let ghostProxGain = null;
let batProxGain   = null;
const PROX_RANGE  = 380; // pixels de alcance do som

function initProximityAudio() {
  // --- Fantasma: dois osciladores levemente desafinados criam batimento sinistro ---
  const g1  = audioCtx.createOscillator();
  const g2  = audioCtx.createOscillator();
  const lfo = audioCtx.createOscillator();
  const lfoG= audioCtx.createGain();
  const gFlt= audioCtx.createBiquadFilter();
  const gGain = audioCtx.createGain();

  g1.type = 'sine'; g1.frequency.setValueAtTime(165, audioCtx.currentTime);
  g2.type = 'sine'; g2.frequency.setValueAtTime(171, audioCtx.currentTime); // +6 Hz → batimento etéreo
  lfo.frequency.setValueAtTime(4.2, audioCtx.currentTime);
  lfoG.gain.setValueAtTime(14, audioCtx.currentTime);
  lfo.connect(lfoG); lfoG.connect(g1.frequency); lfoG.connect(g2.frequency);
  gFlt.type = 'bandpass'; gFlt.frequency.setValueAtTime(180, audioCtx.currentTime); gFlt.Q.setValueAtTime(2, audioCtx.currentTime);
  gGain.gain.setValueAtTime(0, audioCtx.currentTime);

  g1.connect(gFlt); g2.connect(gFlt); gFlt.connect(gGain); gGain.connect(audioCtx.destination);
  g1.start(); g2.start(); lfo.start();
  ghostProxGain = gGain;

  // --- Morcego: sawtooth agudo com tremolo rápido (chiado/batimento de asas) ---
  const bOsc  = audioCtx.createOscillator();
  const bFlt  = audioCtx.createBiquadFilter();
  const bAmp  = audioCtx.createGain();
  const bTrem = audioCtx.createOscillator();
  const bTremG= audioCtx.createGain();
  const bGain = audioCtx.createGain();

  bOsc.type = 'sawtooth'; bOsc.frequency.setValueAtTime(2600, audioCtx.currentTime);
  bFlt.type = 'bandpass'; bFlt.frequency.setValueAtTime(2800, audioCtx.currentTime); bFlt.Q.setValueAtTime(3, audioCtx.currentTime);
  bAmp.gain.setValueAtTime(1, audioCtx.currentTime);
  bTrem.type = 'sine'; bTrem.frequency.setValueAtTime(22, audioCtx.currentTime); // 22 cliques/s
  bTremG.gain.setValueAtTime(0.9, audioCtx.currentTime);
  bTrem.connect(bTremG); bTremG.connect(bAmp.gain); // amplitude modulation = efeito de clique
  bGain.gain.setValueAtTime(0, audioCtx.currentTime);

  bOsc.connect(bFlt); bFlt.connect(bAmp); bAmp.connect(bGain); bGain.connect(audioCtx.destination);
  bOsc.start(); bTrem.start();
  batProxGain = bGain;
}

function updateProximitySounds() {
  if (!audioStarted || !ghostProxGain) return;
  let minGhost = Infinity, minBat = Infinity;
  const px = player.x + player.w / 2, py = player.y + player.h / 2;

  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = px - (e.x + (e.w || 0) / 2);
    const dy = py - (e.y + (e.h || 0) / 2);
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (e instanceof Ghost) minGhost = Math.min(minGhost, dist);
    else                    minBat   = Math.min(minBat,   dist);
  }

  const gVol = minGhost < PROX_RANGE ? (1 - minGhost / PROX_RANGE) * 0.13 : 0;
  const bVol = minBat   < PROX_RANGE ? (1 - minBat   / PROX_RANGE) * 0.09 : 0;
  ghostProxGain.gain.setTargetAtTime(gVol, audioCtx.currentTime, 0.25);
  batProxGain.gain.setTargetAtTime(bVol,   audioCtx.currentTime, 0.15);
}

function stopLoops() {
  const t = audioCtx.currentTime;
  if (droneGain)    { droneGain.gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2); droneGain = null; }
  if (flameGain)    { flameGain.gain.gain.exponentialRampToValueAtTime(0.001, t + 1.2); flameGain = null; }
  if (ghostProxGain){ ghostProxGain.gain.setTargetAtTime(0, t, 0.3); }
  if (batProxGain)  { batProxGain.gain.setTargetAtTime(0, t, 0.3);   }
}

function playStep() {
  const now  = audioCtx.currentTime;
  const src  = audioCtx.createBufferSource();
  src.buffer = createNoiseBuffer(0.15);
  const flt  = audioCtx.createBiquadFilter();
  flt.type   = 'lowpass';
  flt.frequency.setValueAtTime(260, now);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.22, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
  src.connect(flt); flt.connect(gain); gain.connect(audioCtx.destination);
  src.start(now); src.stop(now + 0.15);
}

function playKeyCollect() {
  const now = audioCtx.currentTime;
  [523.25, 659.25, 783.99, 1046.5].forEach((freq, i) => {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type   = 'triangle';
    osc.frequency.setValueAtTime(freq, now + i * 0.09);
    gain.gain.setValueAtTime(0, now + i * 0.09);
    gain.gain.linearRampToValueAtTime(0.22, now + i * 0.09 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + i * 0.09 + 0.28);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now + i * 0.09); osc.stop(now + i * 0.09 + 0.32);
  });
}

function playHurt() {
  const now  = audioCtx.currentTime;
  const src  = audioCtx.createBufferSource();
  src.buffer = createNoiseBuffer(0.35);
  const flt  = audioCtx.createBiquadFilter();
  flt.type   = 'bandpass';
  flt.frequency.setValueAtTime(900, now);
  flt.frequency.exponentialRampToValueAtTime(160, now + 0.28);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.45, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.32);
  src.connect(flt); flt.connect(gain); gain.connect(audioCtx.destination);
  src.start(now); src.stop(now + 0.38);
}

function playGameOver() {
  const now = audioCtx.currentTime;
  [110, 146.83, 174.61].forEach(freq => {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type   = 'sawtooth';
    osc.frequency.setValueAtTime(freq, now);
    osc.frequency.exponentialRampToValueAtTime(freq * 0.65, now + 3.0);
    gain.gain.setValueAtTime(0.12, now);
    gain.gain.exponentialRampToValueAtTime(0.001, now + 3.0);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now); osc.stop(now + 3.2);
  });
}

function playWin() {
  const now = audioCtx.currentTime;
  [{f:523.25,t:0},{f:659.25,t:0.14},{f:783.99,t:0.28},{f:1046.5,t:0.42},
   {f:1318.5,t:0.62},{f:1046.5,t:0.80},{f:1318.5,t:0.96},{f:1567.98,t:1.12}]
  .forEach(({f, t}) => {
    const osc  = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type   = 'triangle';
    osc.frequency.setValueAtTime(f, now + t);
    gain.gain.setValueAtTime(0, now + t);
    gain.gain.linearRampToValueAtTime(0.18, now + t + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, now + t + 0.38);
    osc.connect(gain); gain.connect(audioCtx.destination);
    osc.start(now + t); osc.stop(now + t + 0.42);
  });
}

// Desbloqueia AudioContext no primeiro input (política de autoplay dos browsers)
window.addEventListener('keydown', function startAudio() {
  audioCtx.resume().then(() => {
    if (!audioStarted) {
      audioStarted = true;
      startDrone();
      startFlame();
      initProximityAudio();
      window.removeEventListener('keydown', startAudio);
    }
  });
});

// ── Sistema de iluminação (Canvas 2D – destination-out) ───────────────────────
const lightCvs = document.createElement('canvas');
lightCvs.width = SW; lightCvs.height = SH;
const lctx = lightCvs.getContext('2d');

function applyLight(ctx, tx, ty, radius) {
  // 1. Cobertura de escuridão
  lctx.globalCompositeOperation = 'source-over';
  lctx.fillStyle = 'rgba(0,0,0,0.93)';
  lctx.fillRect(0, 0, SW, SH);

  // 2. Perfura a escuridão com gradiente radial (destination-out)
  const hole = lctx.createRadialGradient(tx, ty, 0, tx, ty, radius);
  hole.addColorStop(0,    'rgba(0,0,0,1)');
  hole.addColorStop(0.25, 'rgba(0,0,0,0.96)');
  hole.addColorStop(0.55, 'rgba(0,0,0,0.78)');
  hole.addColorStop(0.80, 'rgba(0,0,0,0.38)');
  hole.addColorStop(1.0,  'rgba(0,0,0,0)');

  lctx.globalCompositeOperation = 'destination-out';
  lctx.fillStyle = hole;
  lctx.fillRect(0, 0, SW, SH);

  // 3. Tonalidade laranja quente (source-over sobre a máscara já furada)
  lctx.globalCompositeOperation = 'source-over';
  const warm = lctx.createRadialGradient(tx, ty, 0, tx, ty, radius * 0.7);
  warm.addColorStop(0,   'rgba(255,145,30,0.22)');
  warm.addColorStop(0.5, 'rgba(255,95,10,0.12)');
  warm.addColorStop(1,   'rgba(255,60,0,0)');
  lctx.fillStyle = warm;
  lctx.fillRect(0, 0, SW, SH);

  // 4. Borda de chama pulsante (inner glow)
  const pulse = lctx.createRadialGradient(tx, ty, 0, tx, ty, 55);
  pulse.addColorStop(0,   'rgba(255,230,120,0.10)');
  pulse.addColorStop(0.6, 'rgba(255,160,40,0.06)');
  pulse.addColorStop(1,   'rgba(0,0,0,0)');
  lctx.fillStyle = pulse;
  lctx.fillRect(0, 0, SW, SH);

  // 5. Aplica sobre o frame principal
  ctx.drawImage(lightCvs, 0, 0);
}

// ── Renderização do cenário ───────────────────────────────────────────────────
function drawBG(ctx, cx) {
  ctx.fillStyle = '#050210';
  ctx.fillRect(0, 0, SW, SH);

  // Pilares – parallax 0.18×
  const pi0 = Math.floor((cx * 0.18) / 185) - 1;
  for (let i = pi0; i <= pi0 + Math.ceil(SW / 185) + 3; i++) {
    const px = Math.floor(i * 185 - cx * 0.18);
    if (px < -35 || px > SW + 35) continue;
    ctx.fillStyle = '#0d0718';
    ctx.fillRect(px, 0, 30, SH);
    ctx.fillStyle = '#150c22';
    ctx.fillRect(px + 3, 0, 5, SH);
    ctx.fillStyle = '#0a0514';
    ctx.fillRect(px + 22, 0, 5, SH);
  }

  // Estalactites – parallax 0.44×
  const si0 = Math.floor((cx * 0.44) / 135) - 1;
  for (let i = si0; i <= si0 + Math.ceil(SW / 135) + 3; i++) {
    const px = Math.floor(i * 135 - cx * 0.44);
    if (px < -20 || px > SW + 20) continue;
    const h = 22 + (i * 47 + 11) % 52;
    ctx.fillStyle = '#111b0d';
    ctx.fillRect(px, 0, 8, h);
    ctx.beginPath();
    ctx.moveTo(px, h); ctx.lineTo(px + 8, h); ctx.lineTo(px + 4, h + 13);
    ctx.closePath(); ctx.fill();
  }

  // Caveiras – parallax 0.68×
  const sk0 = Math.floor((cx * 0.68) / 340) - 1;
  for (let i = sk0; i <= sk0 + Math.ceil(SW / 340) + 3; i++) {
    const px = Math.floor(i * 340 + 90 - cx * 0.68);
    if (px < -50 || px > SW + 50) continue;
    const py = SH - 30;
    ctx.fillStyle = '#221430';
    ctx.beginPath(); ctx.arc(px, py, 15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2e1c3e'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px, py, 15, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#050210';
    ctx.beginPath(); ctx.ellipse(px - 5, py - 4, 4, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px + 5, py - 4, 4, 5, 0, 0, Math.PI * 2); ctx.fill();
    for (let t = 0; t < 4; t++) {
      ctx.fillRect(px - 7 + t * 5, py + 7, 4, 6);
    }
  }
}

function drawPlatform(ctx, p, cx, cy) {
  const sx = p.x - cx, sy = p.y - cy;
  if (sx > SW + 10 || sx + p.w < -10) return;

  // Corpo
  ctx.fillStyle = '#1c0e2e';
  ctx.fillRect(sx, sy, p.w, p.h);
  // Topo
  ctx.fillStyle = '#37204e';
  ctx.fillRect(sx, sy, p.w, 7);
  // Borda de luz sutil no topo
  ctx.fillStyle = '#4a2d62';
  ctx.fillRect(sx, sy, p.w, 2);
  // Gretas de pedra
  ctx.strokeStyle = '#120820';
  ctx.lineWidth = 1;
  for (let dx = 0; dx < p.w; dx += 38) {
    ctx.beginPath(); ctx.moveTo(sx+dx, sy); ctx.lineTo(sx+dx, sy+p.h); ctx.stroke();
  }
  for (let dy = 0; dy < p.h; dy += 18) {
    ctx.beginPath(); ctx.moveTo(sx, sy+dy); ctx.lineTo(sx+p.w, sy+dy); ctx.stroke();
  }
  // Musgo
  ctx.fillStyle = '#182410';
  for (let dx = 6; dx < p.w - 6; dx += 24) {
    ctx.fillRect(sx + dx, sy, 6, 4 + (dx * 7) % 5);
  }
}

function drawWallTorch(ctx, wx, wy, cx, cy, tick) {
  const sx = Math.floor(wx - cx);
  const sy = Math.floor(wy - cy);
  if (sx < -20 || sx > SW + 20) return;

  // Suporte de metal
  ctx.fillStyle = '#3a2010';
  ctx.fillRect(sx - 2, sy, 4, 14);
  ctx.fillStyle = '#5a3a18';
  ctx.fillRect(sx - 4, sy - 3, 8, 6);

  // Chama pequena
  const w1 = Math.sin(tick * 0.31 + wx * 0.01) * 2;
  ctx.beginPath();
  ctx.moveTo(sx, sy - 3);
  ctx.lineTo(sx - 4 + w1, sy - 10);
  ctx.lineTo(sx, sy - 7);
  ctx.lineTo(sx + 4 + w1 * 0.5, sy - 10);
  ctx.closePath();
  ctx.fillStyle = '#ffca30';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sx, sy - 3);
  ctx.lineTo(sx - 1 + w1 * 0.5, sy - 7);
  ctx.lineTo(sx + 2, sy - 7);
  ctx.closePath();
  ctx.fillStyle = '#ff5500';
  ctx.fill();
}

function drawExitDoor(ctx, cx, cy, keysGot) {
  const dx = EXIT.x - cx, dy = EXIT.y - cy;
  if (dx < -80 || dx > SW + 80) return;
  const locked = keysGot < TOTAL_KEYS;

  // Moldura
  ctx.fillStyle = '#2e1840';
  ctx.fillRect(dx - 7, dy - 74, 56, 78);
  ctx.fillStyle = '#3e2455';
  ctx.fillRect(dx - 4, dy - 71, 50, 6);   // detalhe topo

  // Porta
  ctx.fillStyle = locked ? '#1e1e30' : '#52301a';
  ctx.fillRect(dx, dy - 65, 42, 69);

  // Painéis internos
  ctx.fillStyle = locked ? '#161628' : '#3a2010';
  ctx.fillRect(dx + 4, dy - 61, 15, 28);
  ctx.fillRect(dx + 23, dy - 61, 15, 28);
  ctx.fillRect(dx + 4, dy - 26, 34, 22);

  if (locked) {
    // Cadeado
    ctx.save();
    ctx.shadowColor = '#b89020';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#9e7a1e';
    ctx.beginPath(); ctx.arc(dx + 21, dy - 32, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7e5e14';
    ctx.fillRect(dx + 17, dy - 28, 8, 12);
    ctx.restore();

    // Texto
    ctx.fillStyle = '#d4a820';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(`${keysGot} / ${TOTAL_KEYS} chaves`, dx + 21, dy - 84);
    ctx.textAlign = 'left';
  } else {
    // Brilho dourado
    ctx.save();
    ctx.shadowColor = '#ffe060';
    ctx.shadowBlur = 35;
    ctx.fillStyle = 'rgba(255,220,80,0.2)';
    ctx.beginPath(); ctx.arc(dx + 21, dy - 32, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff8d0';
    ctx.beginPath(); ctx.arc(dx + 21, dy - 32, 7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawHUD(ctx, player) {
  // Corações com bezier
  for (let i = 0; i < 3; i++) {
    const hx = 16 + i * 36, hy = 20;
    ctx.fillStyle = i < player.hp ? '#c81414' : '#38181e';
    ctx.shadowColor = i < player.hp ? 'rgba(200,20,20,0.5)' : 'transparent';
    ctx.shadowBlur  = i < player.hp ? 8 : 0;
    ctx.beginPath();
    ctx.moveTo(hx + 10, hy);
    ctx.bezierCurveTo(hx + 10, hy - 9, hx,      hy - 9, hx,      hy);
    ctx.bezierCurveTo(hx,      hy + 7, hx + 10, hy + 15, hx + 10, hy + 15);
    ctx.bezierCurveTo(hx + 10, hy + 15, hx + 20, hy + 7, hx + 20, hy);
    ctx.bezierCurveTo(hx + 20, hy - 9, hx + 10, hy - 9, hx + 10, hy);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Contador de chaves
  ctx.fillStyle = '#ffd700';
  ctx.font = 'bold 18px monospace';
  ctx.textAlign = 'right';
  ctx.fillText(`Chaves: ${player.keys} / ${TOTAL_KEYS}`, SW - 16, 32);
  ctx.textAlign = 'left';

  // Dica inicial
  if (player.tick < 310 && currentLevelIndex === 0) {
    ctx.globalAlpha = Math.min(1, (310 - player.tick) / 60);
    ctx.fillStyle = 'rgba(190,155,220,0.85)';
    ctx.font = '14px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('A / D = mover   |   SPACE = pular   |   Colete as chaves e chegue à saída!',
      SW / 2, SH - 22);
    ctx.textAlign = 'left';
    ctx.globalAlpha = 1;
  }

  // Narrativa sombria
  if (storyAlpha > 0 && currentStoryText) {
    ctx.globalAlpha = Math.min(1, storyAlpha);
    ctx.fillStyle = '#ffffff';
    ctx.shadowColor = '#000000';
    ctx.shadowBlur = 4;
    ctx.font = '20px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(currentStoryText, SW / 2, Math.max(80, SH / 4));
    ctx.textAlign = 'left';
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

// ── Estado do jogo ────────────────────────────────────────────────────────────
let player, enemies, gameKeys, sparks;
let camX = 0, camY = 0;
let state = 'playing';
let prevState = 'playing';
let flicker = 0, flickT = 0;
let jumpLast = false;
let globalTick = 0;
let stepTimer = 0;

function loadLevel(index) {
  currentLevelIndex = index;
  const lvl = LEVELS[index];
  WORLD_W = lvl.WORLD_W;
  WORLD_H = lvl.WORLD_H;
  PLATFORMS = lvl.PLATFORMS;
  KEY_DEFS = lvl.KEY_DEFS;
  TOTAL_KEYS = KEY_DEFS.length;
  ENEMY_DEFS = lvl.ENEMY_DEFS;
  WALL_TORCHES = lvl.WALL_TORCHES;
  EXIT = lvl.EXIT;
  STORY_ZONES = lvl.STORY_ZONES ? JSON.parse(JSON.stringify(lvl.STORY_ZONES)) : [];
  currentStoryText = "";
  storyAlpha = 0;
}

function resetLevel() {
  loadLevel(currentLevelIndex);
  player   = new Player(50, 490);
  enemies  = ENEMY_DEFS.map(d =>
    d.type === 'ghost' ? new Ghost(d.x, d.y, d.patrol) : new Bat(d.x, d.y, d.patrol));
  gameKeys = KEY_DEFS.map(k => new KeyItem(k.x, k.y));
  sparks   = [];
  camX = 0; camY = 0;
  state = 'playing';
  prevState = 'playing';
  flicker = 0; flickT = 0;
  jumpLast = false;
  globalTick = 0;
  stepTimer = 0;
  if (audioStarted) { startDrone(); startFlame(); initProximityAudio(); }
}

function resetGame() {
  currentLevelIndex = 0;
  resetLevel();
}

// ── Loop de jogo ──────────────────────────────────────────────────────────────
function update() {
  if (state !== 'playing') return;
  globalTick++;

  const goL  = input['ArrowLeft']  || input['KeyA'];
  const goR  = input['ArrowRight'] || input['KeyD'];
  const jump = input['Space'] || input['ArrowUp'] || input['KeyW'];

  player.vx = goR ? MOVE_SPEED : goL ? -MOVE_SPEED : 0;
  if (goR) player.facing = 1;
  if (goL) player.facing = -1;
  if (jump && !jumpLast) player.jump();
  jumpLast = jump;

  const prevInv = player.inv;
  player.update(PLATFORMS);

  // Som de passos: ruído curto ao andar no chão
  stepTimer++;
  if (audioStarted && player.onGround && (goL || goR) && stepTimer % 22 === 0) {
    playStep();
  }

  for (const e of enemies) {
    e.update();
    if (e.alive && hits(player.rect, e.rect)) player.hurt();
  }

  // Som de dano: dispara quando frames de inv são ativados
  if (audioStarted && player.inv > 0 && prevInv === 0) playHurt();

  for (const k of gameKeys) {
    if (!k.collected) {
      if (hits(player.rect, {x:k.x-12, y:k.y-12, w:30, h:30})) {
        k.collected = true;
        player.keys++;
        if (audioStarted) playKeyCollect();
      }
    }
  }

  // Checa saída
  if (player.keys >= TOTAL_KEYS && hits(player.rect, {x:EXIT.x, y:EXIT.y-65, w:42, h:68})) {
    if (currentLevelIndex < LEVELS.length - 1) {
      currentLevelIndex++;
      resetLevel();
      return;
    } else {
      state = 'won';
    }
  }
  if (player.dead) state = 'dead';

  // Narrativa sombria
  for (let i = 0; i < STORY_ZONES.length; i++) {
    if (!STORY_ZONES[i].triggered && player.x > STORY_ZONES[i].triggerX) {
      STORY_ZONES[i].triggered = true;
      currentStoryText = STORY_ZONES[i].text;
      storyAlpha = 3.0;
    }
  }
  if (storyAlpha > 0) {
    storyAlpha -= 0.008;
  }

  // Sons de transição de estado
  if (audioStarted && state !== prevState) {
    stopLoops();
    if (state === 'dead') playGameOver();
    if (state === 'won')  playWin();
    prevState = state;
  }

  // Som de proximidade com inimigos
  updateProximitySounds();

  // Faíscas
  if (Math.random() < 0.45) {
    sparks.push(new Spark(
      player.x + player.w / 2 + player.facing * 17,
      player.y + 14
    ));
  }
  sparks = sparks.filter(s => s.life > 0);
  for (const s of sparks) s.update();

  // Flicker
  flickT++;
  if (flickT % 4 === 0) flicker = ((Math.random() - 0.5) * 30) | 0;

  // Câmera com lerp
  camX = lerp(camX, player.x - SW / 2 + player.w / 2, 0.10);
  camY = lerp(camY, player.y - SH / 2 + player.h / 2, 0.10);
  camX = clamp(camX, 0, WORLD_W - SW);
  camY = clamp(camY, -80, WORLD_H - SH);
}

function draw(ctx) {
  drawBG(ctx, camX);

  for (const p of PLATFORMS) drawPlatform(ctx, p, camX, camY);

  // Tochas decorativas (antes da iluminação → afetadas pela escuridão)
  for (const wt of WALL_TORCHES) drawWallTorch(ctx, wt.x, wt.y, camX, camY, globalTick);

  drawExitDoor(ctx, camX, camY, player.keys);
  for (const k of gameKeys) k.draw(ctx, camX, camY);
  for (const e of enemies)  e.draw(ctx, camX, camY);
  for (const s of sparks)   s.draw(ctx, camX, camY);

  player.draw(ctx, camX, camY);

  // ── Iluminação ──────────────────────────────────────────────────────────────
  const tp = player.torchScreen(camX, camY);
  applyLight(ctx, tp.x, tp.y, TORCH_R + flicker);

  // ── Luzes extras das tochas decorativas ────────────────────────────────────
  // Mini-aura de cada tocha de parede (source-over com alpha baixo)
  lctx.globalCompositeOperation = 'source-over';
  for (const wt of WALL_TORCHES) {
    const wtsx = wt.x - camX, wtsy = wt.y - camY;
    if (wtsx < -80 || wtsx > SW + 80) continue;
    const mini = lctx.createRadialGradient(wtsx, wtsy - 8, 0, wtsx, wtsy - 8, 55);
    mini.addColorStop(0,   'rgba(255,160,40,0.22)');
    mini.addColorStop(0.5, 'rgba(255,100,10,0.08)');
    mini.addColorStop(1,   'rgba(0,0,0,0)');
    // Desenhamos no lightCvs antes do próximo frame (reutilizamos)
  }

  // HUD (acima de tudo)
  drawHUD(ctx, player);

  // Overlay de estado
  if (state === 'dead' || state === 'won') {
    const color = state === 'dead' ? 'rgba(80,0,0,0.58)' : 'rgba(0,55,10,0.58)';
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, SW, SH);

    ctx.textAlign = 'center';
    if (state === 'dead') {
      ctx.fillStyle = '#d01818';
      ctx.font = 'bold 68px monospace';
      ctx.fillText('VOCÊ MORREU', SW / 2, SH / 2 - 18);
      ctx.fillStyle = '#aa5050';
      ctx.font = '30px monospace';
      ctx.fillText('Pressione R para reiniciar', SW / 2, SH / 2 + 44);
    } else {
      ctx.fillStyle = '#44e060';
      ctx.font = 'bold 68px monospace';
      ctx.fillText('ESCAPOU!', SW / 2, SH / 2 - 18);
      ctx.fillStyle = '#70c880';
      ctx.font = '30px monospace';
      ctx.fillText('Pressione R para jogar novamente', SW / 2, SH / 2 + 44);
    }
    ctx.textAlign = 'left';
  }
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  if (e.code === 'KeyR' && state !== 'playing') {
    if (state === 'dead') resetLevel();
    else resetGame();
  }
});

const canvas = document.getElementById('game');
canvas.width  = SW;
canvas.height = SH;
const ctx = canvas.getContext('2d');

// Escalona o canvas para telas menores mantendo aspecto
function fitCanvas() {
  const scale = Math.min(window.innerWidth / SW, window.innerHeight / SH);
  canvas.style.width  = `${SW * scale}px`;
  canvas.style.height = `${SH * scale}px`;
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

resetGame();

(function loop() {
  update();
  draw(ctx);
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>

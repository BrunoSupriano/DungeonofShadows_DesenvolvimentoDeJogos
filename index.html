// ── Utilitários ───────────────────────────────────────────────────────────────
const lerp  = (a, b, t) => a + (b - a) * t;
const clamp = (v, lo, hi) => Math.min(Math.max(v, lo), hi);
const rng   = (lo, hi) => lo + Math.random() * (hi - lo);
const hits  = (a, b) =>
  a.x < b.x + b.w && a.x + a.w > b.x &&
  a.y < b.y + b.h && a.y + a.h > b.y;

// ── Classes ───────────────────────────────────────────────────────────────────
class Player {
  constructor(x, y) {
    this.x = x;   this.y = y;
    this.w = 24;  this.h = 40;
    this.vx = 0;  this.vy = 0;
    this.onGround = false;
    this.facing = 1;
    this.hp = 3;
    this.inv = 0;          // frames de invencibilidade
    this.dead = false;
    this.won  = false;
    this.keys = 0;
    this.tick = 0;
    this.torchFuel = 1;    // 1 = tocha plena; decai com o tempo (lento nas fases comuns)
    this.cpx = x; this.cpy = y;  // checkpoint: última posição segura (itens 15/16/20)
  }
  get rect() { return {x:this.x, y:this.y, w:this.w, h:this.h}; }

  update(plats) {
    if (this.dead) return;
    this.vy = Math.min(this.vy + GRAVITY, 22);

    // Eixo X
    this.x += this.vx;
    for (const p of plats) {
      if (hits(this.rect, p)) {
        if (this.vx > 0) this.x = p.x - this.w;
        else             this.x = p.x + p.w;
        this.vx = 0;
      }
    }

    // Eixo Y
    this.y += this.vy;
    this.onGround = false;
    for (const p of plats) {
      if (hits(this.rect, p)) {
        if (this.vy >= 0) { this.y = p.y - this.h; this.onGround = true; }
        else              { this.y = p.y + p.h; }
        this.vy = 0;
      }
    }

    this.x = clamp(this.x, 0, WORLD_W - this.w);
    if (this.y > WORLD_H) this.fall();
    if (this.inv > 0) this.inv--;
    this.tick++;
  }

  jump() { if (this.onGround) this.vy = JUMP_POWER; }

  // Dano de contato: tira vida e empurra o herói no local, sem perder o progresso (item 14)
  hurt(knockDir = 0) {
    if (this.inv > 0 || this.dead) return;
    this.hp--;
    this.inv = 95;
    if (knockDir !== 0) { this.vx = knockDir * 6; this.vy = -7; }
    if (this.hp <= 0) this.dead = true;
  }

  // Queda em abismo: volta ao último checkpoint seguro (itens 15/16/20)
  fall() {
    if (this.dead) return;
    this.hp--;
    this.inv = 95;
    this.x = this.cpx; this.y = this.cpy;
    this.vx = 0; this.vy = 0;
    if (this.hp <= 0) this.dead = true;
  }

  torchScreen(cx, cy) {
    return {
      x: this.x - cx + this.w / 2 + this.facing * 16,
      y: this.y - cy + 18,
    };
  }

  draw(ctx, cx, cy) {
    if (this.dead) return;
    if (this.inv > 0 && Math.floor(this.tick / 5) % 2 === 1) return;

    const sx = Math.floor(this.x - cx);
    const sy = Math.floor(this.y - cy);
    const leg = this.vx !== 0 ? Math.sin(this.tick * 0.22) * 4 : 0;

    // Pernas
    ctx.fillStyle = '#2e1d3e';
    ctx.fillRect(sx + 4,  sy + 36, 8, 6 + leg);
    ctx.fillRect(sx + 12, sy + 36, 8, 6 - leg);
    // Corpo
    ctx.fillStyle = '#3f2558';
    ctx.fillRect(sx + 3, sy + 16, 18, 22);
    // Capa / ombros
    ctx.fillStyle = '#2c1842';
    ctx.fillRect(sx + 1, sy + 16, 22, 7);
    // Cabeça
    ctx.fillStyle = '#c3a080';
    ctx.fillRect(sx + 4, sy + 3, 16, 14);
    // Capuz
    ctx.fillStyle = '#2c1842';
    ctx.fillRect(sx + 2, sy + 1, 20, 9);
    ctx.fillRect(sx + 4, sy + 9, 16, 5);
    // Olho
    ctx.fillStyle = '#0f0818';
    const ex = this.facing === 1 ? sx + 14 : sx + 6;
    ctx.fillRect(ex, sy + 8, 3, 3);

    // --- Tocha ---
    const tx = this.facing === 1 ? sx + this.w + 1 : sx - 7;
    const ty = sy + 14;
    const w1 = Math.sin(this.tick * 0.28) * 3;
    const w2 = Math.sin(this.tick * 0.35) * 3;

    // Cabo de madeira
    ctx.fillStyle = '#6b4020';
    ctx.fillRect(tx, ty + 4, 4, 17);
    // Brasa no topo do cabo
    ctx.fillStyle = '#ff8000';
    ctx.fillRect(tx - 1, ty + 2, 6, 5);

    // Chama externa
    ctx.beginPath();
    ctx.moveTo(tx + 2, ty + 5);
    ctx.lineTo(tx - 4 + w1, ty - 8);
    ctx.lineTo(tx + 2, ty - 1);
    ctx.lineTo(tx + 8 + w2, ty - 8);
    ctx.closePath();
    ctx.fillStyle = '#ffce38';
    ctx.fill();

    // Chama interna
    ctx.beginPath();
    ctx.moveTo(tx + 2, ty + 3);
    ctx.lineTo(tx + w1 * 0.5, ty - 3);
    ctx.lineTo(tx + 4 + w2 * 0.5, ty - 3);
    ctx.closePath();
    ctx.fillStyle = '#ff5a00';
    ctx.fill();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
class Ghost {
  constructor(x, y, patrol) {
    this.x = x; this.y = y;
    this.bx = x; this.by = y;
    this.w = 34; this.h = 40;
    this.patrol = patrol;
    this.speed = rng(0.8, 1.5);
    this.dir = 1;
    this.t = rng(0, 120);
    this.alive = true;
  }
  get rect() { return {x:this.x, y:this.y, w:this.w, h:this.h}; }
  update() {
    this.x += this.speed * this.dir;
    if (this.x > this.bx + this.patrol) this.dir = -1;
    else if (this.x < this.bx)          this.dir =  1;
    this.y = this.by + Math.sin(this.t * 0.045) * 10;
    this.t++;
  }
  draw(ctx, cx, cy) {
    if (!this.alive) return;
    const sx = Math.floor(this.x - cx);
    const sy = Math.floor(this.y - cy);
    if (sx < -60 || sx > SW + 60) return;

    ctx.save();
    ctx.globalAlpha = 0.78 + Math.sin(this.t * 0.07) * 0.12;

    // Glow
    ctx.shadowColor = 'rgba(160, 210, 230, 0.9)';
    ctx.shadowBlur = 22;

    // Corpo
    ctx.fillStyle = '#a0d3e8';
    ctx.beginPath();
    ctx.ellipse(sx + 17, sy + 14, 17, 14, 0, 0, Math.PI * 2);
    ctx.fill();

    // Cauda ondulada
    for (let i = 0; i < 3; i++) {
      const wv = Math.sin(this.t * 0.12 + i * 2.1) * 5;
      ctx.beginPath();
      ctx.ellipse(sx + i * 12 + 6, sy + 27 + wv, 8, 9, 0, 0, Math.PI * 2);
      ctx.fill();
    }

    ctx.shadowBlur = 0;

    // Outline brilhante
    ctx.strokeStyle = 'rgba(210, 248, 255, 0.55)';
    ctx.lineWidth = 1.5;
    ctx.beginPath();
    ctx.ellipse(sx + 17, sy + 14, 17, 14, 0, 0, Math.PI * 2);
    ctx.stroke();

    // Olhos vazados
    ctx.fillStyle = 'rgba(15, 5, 30, 0.92)';
    ctx.beginPath(); ctx.ellipse(sx + 9,  sy + 13, 4.5, 6, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(sx + 24, sy + 13, 4.5, 6, 0, 0, Math.PI * 2); ctx.fill();

    // Brilho dos olhos (almas presas)
    ctx.fillStyle = 'rgba(80, 0, 120, 0.6)';
    ctx.beginPath(); ctx.arc(sx + 9,  sy + 13, 2, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 24, sy + 13, 2, 0, Math.PI * 2); ctx.fill();

    // Gotas de sangue
    ctx.fillStyle = 'rgba(190, 10, 10, 0.85)';
    ctx.beginPath(); ctx.arc(sx + 10, sy + 29, 3.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 24, sy + 25, 2.5, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
class Bat {
  constructor(x, y, patrol) {
    this.bx = x; this.by = y;
    this.x = x; this.y = y;
    this.w = 32; this.h = 20;
    this.patrol = patrol;
    this.angle = rng(0, Math.PI * 2);
    this.t = rng(0, 60);
    this.alive = true;
  }
  get rect() { return {x:this.x, y:this.y, w:this.w, h:this.h}; }
  update() {
    this.angle += 0.028;
    this.x = this.bx + Math.cos(this.angle) * this.patrol * 0.5;
    this.y = this.by + Math.sin(this.angle * 1.4) * 55;
    this.t++;
  }
  draw(ctx, cx, cy) {
    if (!this.alive) return;
    const sx = Math.floor(this.x - cx);
    const sy = Math.floor(this.y - cy);
    if (sx < -60 || sx > SW + 60) return;

    const flap = Math.sin(this.t * 0.28) * 7;

    ctx.save();
    ctx.shadowColor = 'rgba(110, 55, 150, 0.6)';
    ctx.shadowBlur = 10;

    // Asas
    ctx.fillStyle = '#4e2868';
    ctx.beginPath();
    ctx.moveTo(sx + 10, sy + 11);
    ctx.lineTo(sx - 4,  sy + flap);
    ctx.lineTo(sx + 2,  sy + 18);
    ctx.closePath();
    ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx + 22, sy + 11);
    ctx.lineTo(sx + 36, sy + flap);
    ctx.lineTo(sx + 30, sy + 18);
    ctx.closePath();
    ctx.fill();

    // Corpo
    ctx.shadowBlur = 0;
    ctx.fillStyle = '#301845';
    ctx.beginPath();
    ctx.ellipse(sx + 16, sy + 11, 8, 7, 0, 0, Math.PI * 2);
    ctx.fill();

    // Orelhas
    ctx.fillStyle = '#4e2868';
    ctx.beginPath();
    ctx.moveTo(sx + 11, sy + 6); ctx.lineTo(sx + 8,  sy - 3); ctx.lineTo(sx + 14, sy + 4); ctx.fill();
    ctx.beginPath();
    ctx.moveTo(sx + 21, sy + 6); ctx.lineTo(sx + 24, sy - 3); ctx.lineTo(sx + 18, sy + 4); ctx.fill();

    // Olhos vermelhos
    ctx.fillStyle = '#ee1111';
    ctx.beginPath(); ctx.arc(sx + 13, sy + 9, 2.5, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.arc(sx + 19, sy + 9, 2.5, 0, Math.PI * 2); ctx.fill();

    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
class KeyItem {
  constructor(x, y, memory) {
    this.x = x; this.y = y;
    this.collected = false;
    this.t = rng(0, 60);
    this.memory = memory || null;   // fragmento de memória revelado ao coletar (item B10)
  }
  draw(ctx, cx, cy) {
    if (this.collected) return;
    this.t++;
    const sx = Math.floor(this.x - cx);
    const sy = Math.floor(this.y - cy + Math.sin(this.t * 0.07) * 5);
    if (sx < -40 || sx > SW + 40) return;

    ctx.save();
    ctx.shadowColor = '#ffd700';
    ctx.shadowBlur = 18;
    ctx.strokeStyle = '#ffcd37';
    ctx.fillStyle   = '#ffcd37';
    ctx.lineWidth   = 3;

    // Argola
    ctx.beginPath();
    ctx.arc(sx, sy, 10, 0, Math.PI * 2);
    ctx.stroke();

    // Cabo
    ctx.lineWidth = 4;
    ctx.beginPath();
    ctx.moveTo(sx + 2, sy + 4);
    ctx.lineTo(sx + 18, sy + 4);
    ctx.stroke();

    // Dentes
    ctx.lineWidth = 3;
    ctx.beginPath(); ctx.moveTo(sx + 14, sy + 4); ctx.lineTo(sx + 14, sy + 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + 10, sy + 4); ctx.lineTo(sx + 10, sy + 8); ctx.stroke();

    ctx.restore();
  }
}

// Coração coletável: recupera 1 ponto de vida (item 17)
class Heart {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.collected = false;
    this.t = rng(0, 60);
  }
  get rect() { return {x:this.x - 12, y:this.y - 12, w:26, h:26}; }
  draw(ctx, cx, cy) {
    if (this.collected) return;
    this.t++;
    const sx = Math.floor(this.x - cx);
    const sy = Math.floor(this.y - cy + Math.sin(this.t * 0.07) * 5);
    if (sx < -40 || sx > SW + 40) return;
    const pulse = 1 + Math.sin(this.t * 0.12) * 0.08;
    ctx.save();
    ctx.translate(sx, sy);
    ctx.scale(pulse, pulse);
    ctx.shadowColor = 'rgba(220,30,40,0.8)';
    ctx.shadowBlur = 14;
    ctx.fillStyle = '#e21824';
    ctx.beginPath();
    ctx.moveTo(0, 4);
    ctx.bezierCurveTo(0, -5, -11, -5, -11, 2);
    ctx.bezierCurveTo(-11, 9, 0, 15, 0, 18);
    ctx.bezierCurveTo(0, 15, 11, 9, 11, 2);
    ctx.bezierCurveTo(11, -5, 0, -5, 0, 4);
    ctx.fill();
    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Mini-sombra (Fase 2): persegue no escuro, recua e sofre dano na luz da tocha.
// Ensina, antes do boss, que a luz é a arma do herói (itens 10/11).
class Shade {
  constructor(x, y, patrol) {
    this.x = x; this.y = y;
    this.bx = x; this.by = y;
    this.w = 30; this.h = 46;
    this.patrol = patrol || 120;
    this.t = rng(0, 60);
    this.alive = true;
    this.hp = 3;
    this.flash = 0;
    this.dieT = 0;
    this.vx = 0;
  }
  get rect() { return {x:this.x + 6, y:this.y + 8, w:this.w - 12, h:this.h - 16}; }
  get cxp()  { return this.x + this.w / 2; }
  get cyp()  { return this.y + this.h / 2; }
  update(player) {
    this.t++;
    if (!this.alive) { this.dieT++; return; }

    const ptx = player.x + player.w / 2 + player.facing * 16;
    const pty = player.y + 18;
    const dx = this.cxp - ptx, dy = this.cyp - pty;
    const d = Math.hypot(dx, dy) || 1;
    const R = 155;

    if (d < R && player.torchFuel > 0.05) {
      // Na luz: recua e definha
      const f = (1 - d / R) * player.torchFuel;
      this.hp -= f * 0.05;
      this.flash = 5;
      this.x += (dx / d) * 2.6 * f;
      this.y = clamp(this.y + (dy / d) * 1.4 * f, this.by - 40, this.by + 40);
      if (this.hp <= 0) { this.hp = 0; this.alive = false; }
    } else {
      // No escuro: avança devagar e flutua para o jogador
      const tx = (player.x + player.w / 2) - this.cxp;
      this.vx = lerp(this.vx, Math.sign(tx) * 0.9, 0.04);
      this.x += this.vx;
      this.x = clamp(this.x, this.bx - this.patrol, this.bx + this.patrol);
      this.y = this.by + Math.sin(this.t * 0.05) * 8;
    }
    if (this.flash > 0) this.flash--;
  }
  draw(ctx, cx, cy) {
    if (!this.alive && this.dieT > 60) return;
    const sx = Math.floor(this.x - cx);
    const sy = Math.floor(this.y - cy);
    if (sx < -60 || sx > SW + 60) return;
    const cxp = sx + this.w / 2;

    ctx.save();
    if (!this.alive) ctx.globalAlpha = Math.max(0, 1 - this.dieT / 60);
    ctx.shadowColor = this.flash > 0 ? 'rgba(255,120,40,0.85)' : 'rgba(70,0,110,0.85)';
    ctx.shadowBlur = 16;

    // Manto
    const sway = Math.sin(this.t * 0.08) * 4;
    ctx.fillStyle = this.flash > 0 ? '#5a2424' : '#16091f';
    ctx.beginPath();
    ctx.moveTo(cxp, sy);
    ctx.quadraticCurveTo(sx - 4 + sway, sy + this.h * 0.5, sx + 4, sy + this.h);
    for (let i = 0; i <= 4; i++) {
      const fx = sx + 4 + (this.w - 8) * (i / 4);
      const fy = sy + this.h + Math.sin(this.t * 0.13 + i) * 6;
      ctx.lineTo(fx, fy);
    }
    ctx.quadraticCurveTo(sx + this.w + 4 - sway, sy + this.h * 0.5, cxp, sy);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // Olhos
    const eyeC = this.flash > 0 ? '#ff5500' : '#c0008a';
    ctx.fillStyle = eyeC; ctx.shadowColor = eyeC; ctx.shadowBlur = 12;
    ctx.beginPath(); ctx.ellipse(cxp - 6, sy + 16, 2.5, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cxp + 6, sy + 16, 2.5, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ─────────────────────────────────────────────────────────────────────────────
class Spark {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.vx = rng(-2.2, 2.2);
    this.vy = rng(-3.0, -0.5);
    this.life = (rng(14, 30)) | 0;
    this.maxLife = this.life;
    this.size = rng(1.5, 3.5);
  }
  update() {
    this.x += this.vx; this.y += this.vy;
    this.vy += 0.09; this.vx *= 0.97;
    this.life--;
  }
  draw(ctx, cx, cy) {
    const t = this.life / this.maxLife;
    ctx.globalAlpha = t * 0.9;
    ctx.fillStyle = `rgb(255,${(80 + 120 * t) | 0},0)`;
    ctx.beginPath();
    ctx.arc(this.x - cx, this.y - cy, Math.max(0.5, this.size * t), 0, Math.PI * 2);
    ctx.fill();
    ctx.globalAlpha = 1;
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Fogueira do cenário (Fase do Boss): pode ser acesa com a tocha e apaga sozinha
class Campfire {
  constructor(x, y, reward) {
    this.x = x; this.y = y;
    this.lit = false;
    this.t = rng(0, 60);
    this.eternal = false;     // fogueiras apagáveis: o vento as apaga, o herói as reacende (item 1)
    this.radius = 185;        // luz de cada fogueira (item 6 — várias alturas cobrem a arena)
    this.reward = reward || null;   // 'heart' → solta um coração ao ser acesa (item A3)
    this.rewardGiven = false;
  }
  get flameX() { return this.x; }
  get flameY() { return this.y - 20; }
  light() {
    if (this.lit) return false;
    this.lit = true;
    return true;
  }
  extinguish() { if (!this.eternal) this.lit = false; }
  update() {
    this.t++;
  }
  draw(ctx, cx, cy) {
    const sx = Math.floor(this.x - cx);
    const sy = Math.floor(this.y - cy);
    if (sx < -60 || sx > SW + 60) return;

    // Lenha
    ctx.strokeStyle = '#3a2412';
    ctx.lineWidth = 5;
    ctx.beginPath(); ctx.moveTo(sx - 14, sy); ctx.lineTo(sx + 10, sy - 9); ctx.stroke();
    ctx.beginPath(); ctx.moveTo(sx + 14, sy); ctx.lineTo(sx - 10, sy - 9); ctx.stroke();
    ctx.fillStyle = '#241608';
    ctx.fillRect(sx - 16, sy - 3, 32, 6);

    if (this.lit) {
      const w1 = Math.sin(this.t * 0.30) * 4;
      const w2 = Math.sin(this.t * 0.41 + 1) * 4;
      const hh = 30 + Math.sin(this.t * 0.5) * 5;
      // Brasas
      ctx.fillStyle = '#ff7b00';
      ctx.fillRect(sx - 9, sy - 7, 18, 5);
      // Chama externa
      ctx.beginPath();
      ctx.moveTo(sx - 11, sy - 5);
      ctx.lineTo(sx - 4 + w1, sy - hh * 0.6);
      ctx.lineTo(sx, sy - hh);
      ctx.lineTo(sx + 4 + w2, sy - hh * 0.6);
      ctx.lineTo(sx + 11, sy - 5);
      ctx.closePath();
      ctx.fillStyle = '#ffce38';
      ctx.fill();
      // Chama interna
      ctx.beginPath();
      ctx.moveTo(sx - 5, sy - 5);
      ctx.lineTo(sx + w1 * 0.6, sy - hh * 0.7);
      ctx.lineTo(sx + 5, sy - 5);
      ctx.closePath();
      ctx.fillStyle = '#ff5a00';
      ctx.fill();
    } else {
      // Fumaça da fogueira apagada
      ctx.fillStyle = 'rgba(120,120,135,0.22)';
      ctx.beginPath();
      ctx.arc(sx, sy - 16 - (this.t * 0.2 % 14), 4 + Math.sin(this.t * 0.05) * 2, 0, Math.PI * 2);
      ctx.fill();
      // Brasa pulsante: sinaliza que a fogueira é INTERATIVA (acendível) (item A5)
      const glow = 0.35 + Math.sin(this.t * 0.08) * 0.25;
      ctx.save();
      ctx.shadowColor = 'rgba(255,120,30,0.8)';
      ctx.shadowBlur = 10 + glow * 10;
      ctx.fillStyle = `rgba(255,${(90 + glow * 60) | 0},20,${0.5 + glow * 0.4})`;
      ctx.fillRect(sx - 6, sy - 6, 12, 4);
      ctx.restore();
    }
  }
}

// ─────────────────────────────────────────────────────────────────────────────
// Boss final: "A Sombra". Persegue na escuridão, foge e sofre dano na luz.
class Boss {
  constructor(x, y) {
    this.x = x; this.y = y;
    this.w = 76; this.h = 104;
    this.vx = 0; this.vy = 0;
    this.t = 0;
    this.maxHp = BOSS_HP;
    this.hp = BOSS_HP;
    this.alive = true;
    this.inLight = false;
    this.flash = 0;
    this.dieT = 0;
    this.lungeT = 120;        // contagem para a próxima investida
  }
  get rect() { return {x:this.x + 16, y:this.y + 12, w:this.w - 32, h:this.h - 24}; }
  get cx()   { return this.x + this.w / 2; }
  get cy()   { return this.y + this.h / 2; }

  update(player, campfires) {
    this.t++;
    if (!this.alive) { this.dieT++; return; }

    // ── Exposição à luz (tocha do jogador + fogueiras acesas) ──
    let exposure = 0, fleeX = 0, fleeY = 0;

    const ptx = player.x + player.w / 2 + player.facing * 16;
    const pty = player.y + 18;
    const pdx = this.cx - ptx, pdy = this.cy - pty;
    const pdist = Math.hypot(pdx, pdy) || 1;
    const PTORCH_R = 150;
    if (pdist < PTORCH_R) {
      // A tocha do herói só fere/afugenta a Sombra na medida em que está acesa
      const f = (1 - pdist / PTORCH_R) * player.torchFuel;
      exposure += f * 0.5;                 // tocha do jogador: dano fraco
      fleeX += (pdx / pdist) * f;
      fleeY += (pdy / pdist) * f;
    }
    for (const cf of campfires) {
      if (!cf.lit) continue;
      const dx = this.cx - cf.flameX, dy = this.cy - cf.flameY;
      const d = Math.hypot(dx, dy) || 1;
      if (d < cf.radius) {
        const f = 1 - d / cf.radius;
        exposure += f;                     // fogueiras: dano forte
        fleeX += (dx / d) * f;
        fleeY += (dy / d) * f;
      }
    }

    // Faixa de combate: acompanha o jogador, nunca foge para o teto inalcançável
    const pcy = player.y + player.h / 2;
    const desiredY = clamp(pcy - 90, 150, 430);

    this.inLight = exposure > 0.02;
    if (this.inLight) {
      this.hp -= exposure * 0.9;
      this.flash = 10;            // flash mais forte: deixa claro que a luz está ferindo (item 18)
      if (this.hp <= 0) { this.hp = 0; this.alive = false; }
      // Foge na HORIZONTAL (mantém-se na faixa de combate → pode ser encurralado)
      const sgn = fleeX >= 0 ? 1 : -1;
      this.vx = lerp(this.vx, sgn * 2.8, 0.14);
      this.vy = lerp(this.vy, (desiredY - this.cy) * 0.04, 0.10);
      this.lungeT = 90;
    } else {
      // Persegue o jogador; investidas periódicas o forçam para baixo, à luz.
      // Quanto mais fraca a tocha do herói, mais ousada e veloz fica a Sombra.
      const darkBoldness = 1 + (1 - player.torchFuel) * 0.55;   // até +55% no escuro (item 21 — justo após o vento)
      const dx = (player.x + player.w / 2) - this.cx;
      const d  = Math.abs(dx) || 1;
      this.lungeT--;
      const lunging = this.lungeT < 24;
      const spd = (lunging ? 4.2 : 2.2) * darkBoldness;
      this.vx = lerp(this.vx, (dx / d) * spd, lunging ? 0.12 : 0.05);
      const dyT = (lunging ? pcy : desiredY) - this.cy;
      this.vy = lerp(this.vy, dyT * 0.05, 0.06);
      if (this.lungeT <= 0) {
        const base = 150 + (rng(0, 90) | 0);
        this.lungeT = (player.torchFuel > 0.4 ? base : base * 0.55) | 0;  // investe mais no escuro
      }
    }
    if (this.flash > 0) this.flash--;

    this.x += this.vx;
    this.y += this.vy;
    this.x = clamp(this.x, 20, WORLD_W - this.w - 20);
    this.y = clamp(this.y, 60, 470);
  }

  draw(ctx, cx, cy) {
    const sx = Math.floor(this.x - cx);
    const sy = Math.floor(this.y - cy);
    const cxp = sx + this.w / 2;

    ctx.save();
    if (!this.alive) ctx.globalAlpha = Math.max(0, 1 - this.dieT / 120);

    // Aura
    ctx.shadowColor = this.inLight ? 'rgba(255,120,40,0.85)' : 'rgba(70,0,110,0.9)';
    ctx.shadowBlur  = this.inLight ? 32 : 26;

    // Manto esvoaçante
    const sway = Math.sin(this.t * 0.06) * 6;
    ctx.fillStyle = this.flash > 0 ? '#6a2a2a' : '#140820';
    ctx.beginPath();
    ctx.moveTo(cxp, sy);
    ctx.quadraticCurveTo(sx - 8 + sway, sy + this.h * 0.5, sx + 6, sy + this.h);
    for (let i = 0; i <= 6; i++) {
      const fx = sx + 6 + (this.w - 12) * (i / 6);
      const fy = sy + this.h + Math.sin(this.t * 0.12 + i) * 8;
      ctx.lineTo(fx, fy);
    }
    ctx.quadraticCurveTo(sx + this.w + 8 - sway, sy + this.h * 0.5, cxp, sy);
    ctx.closePath();
    ctx.fill();
    ctx.shadowBlur = 0;

    // Capuz
    ctx.fillStyle = this.flash > 0 ? '#7a3a3a' : '#0c0414';
    ctx.beginPath();
    ctx.ellipse(cxp, sy + 32, 27, 34, 0, 0, Math.PI * 2);
    ctx.fill();

    // Olhos
    const eyeC = this.inLight ? '#ff5500' : '#d40090';
    ctx.fillStyle = eyeC;
    ctx.shadowColor = eyeC; ctx.shadowBlur = 16;
    ctx.beginPath(); ctx.ellipse(cxp - 10, sy + 30, 4, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(cxp + 10, sy + 30, 4, 8, 0, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

// ── Sistema de Áudio (Web Audio API – Procedural) ────────────────────────────
const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
let audioStarted = false;
let audioMuted = false;
let droneGain = null, flameGain = null;

// ── Barramento principal: tudo passa por master → compressor → destino (itens C22/C26) ──
// O compressor cola os picos somados dos vários loops e evita o clipping/distorção do fundo.
const masterGain = audioCtx.createGain();
masterGain.gain.value = 0.85;
const masterComp = audioCtx.createDynamicsCompressor();
masterComp.threshold.setValueAtTime(-18, audioCtx.currentTime);
masterComp.knee.setValueAtTime(22, audioCtx.currentTime);
masterComp.ratio.setValueAtTime(3.5, audioCtx.currentTime);
masterComp.attack.setValueAtTime(0.005, audioCtx.currentTime);
masterComp.release.setValueAtTime(0.25, audioCtx.currentTime);
masterGain.connect(masterComp);
masterComp.connect(audioCtx.destination);

// Reverb curto de ambiência (item C27): tira o som "seco" de masmorra.
function makeImpulse(sec, decay) {
  const len = (audioCtx.sampleRate * sec) | 0;
  const buf = audioCtx.createBuffer(2, len, audioCtx.sampleRate);
  for (let ch = 0; ch < 2; ch++) {
    const d = buf.getChannelData(ch);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, decay);
  }
  return buf;
}
const reverb = audioCtx.createConvolver();
reverb.buffer = makeImpulse(1.8, 2.6);
reverb.connect(masterComp);   // saída do reverb entra depois do master (não realimenta)

// Manda uma porção de um nó ao reverb (sinal "molhado")
function sendToReverb(node, amount) {
  const s = audioCtx.createGain();
  s.gain.value = amount;
  node.connect(s); s.connect(reverb);
}

function setMuted(m) {
  audioMuted = m;
  masterGain.gain.setTargetAtTime(m ? 0.0001 : 0.85, audioCtx.currentTime, 0.05);
  if (ghostAudio) ghostAudio.muted = m;
}

function createNoiseBuffer(sec) {
  const buf = audioCtx.createBuffer(1, audioCtx.sampleRate * sec | 0, audioCtx.sampleRate);
  const d = buf.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
  return buf;
}

function startDrone() {
  if (droneGain) return;            // guarda anti-empilhamento: o drone toca contínuo entre fases (item C21)
  const osc    = audioCtx.createOscillator();
  const osc2   = audioCtx.createOscillator();   // segunda voz grave, uma quinta abaixo → drone mais "vivo"
  const filter = audioCtx.createBiquadFilter();
  const gain   = audioCtx.createGain();
  const lfo    = audioCtx.createOscillator();
  const lfoG   = audioCtx.createGain();

  lfo.frequency.setValueAtTime(0.12, audioCtx.currentTime);   // oscilação mais lenta e sutil
  lfoG.gain.setValueAtTime(4, audioCtx.currentTime);          // menos profundidade → menos batimento dissonante
  lfo.connect(lfoG); lfoG.connect(osc.frequency); lfoG.connect(osc2.frequency); lfo.start();

  osc.type  = 'sawtooth'; osc.frequency.setValueAtTime(55, audioCtx.currentTime);
  osc2.type = 'sine';     osc2.frequency.setValueAtTime(41.2, audioCtx.currentTime);
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(170, audioCtx.currentTime);
  gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.06, audioCtx.currentTime + 2.0);   // fade-in (item C28)

  osc.connect(filter); osc2.connect(filter); filter.connect(gain); gain.connect(masterGain);
  sendToReverb(gain, 0.12);
  osc.start(); osc2.start();
  droneGain = { gain, osc, osc2, lfo };
}

function startFlame() {
  if (flameGain) return;            // guarda anti-empilhamento (item C21)
  const src    = audioCtx.createBufferSource();
  src.buffer   = createNoiseBuffer(2);
  src.loop     = true;
  const filter = audioCtx.createBiquadFilter();
  filter.type  = 'bandpass';
  filter.frequency.setValueAtTime(520, audioCtx.currentTime);  // mais grave e "abafado", menos estática (item C24)
  filter.Q.setValueAtTime(1.4, audioCtx.currentTime);          // banda mais estreita = chama, não chiado
  // LFO lento na frequência do filtro → a chama "respira" em vez de ruído fixo
  const fLfo = audioCtx.createOscillator();
  const fLfoG = audioCtx.createGain();
  fLfo.frequency.setValueAtTime(0.33, audioCtx.currentTime);
  fLfoG.gain.setValueAtTime(120, audioCtx.currentTime);
  fLfo.connect(fLfoG); fLfoG.connect(filter.frequency); fLfo.start();
  const gain   = audioCtx.createGain();
  gain.gain.setValueAtTime(0.0001, audioCtx.currentTime);
  gain.gain.linearRampToValueAtTime(0.028, audioCtx.currentTime + 1.5);  // bem mais baixo (item C26)

  src.connect(filter); filter.connect(gain); gain.connect(masterGain);
  sendToReverb(gain, 0.10);
  src.start();
  flameGain = { gain, src, fLfo };
}

// ── Sons de Proximidade (fantasmas e morcegos) ────────────────────────────────
let ghostAudio  = null;  // som real do fantasma (arquivo em loop)
let batProxGain = null;
const PROX_RANGE      = 380;  // pixels de alcance do som
const GHOST_MAX_VOL   = 0.55; // volume máximo do fantasma quando bem próximo (item C26)

function initProximityAudio() {
  // --- Fantasma: som real de "vozes fantasmagóricas" tocado em loop ---
  // Áudio: "ghostly voices" por ERH (freesound.org/people/ERH/sounds/36757) — licença CC BY 3.0
  if (!ghostAudio) {
    ghostAudio = new Audio('assets/sounds/ghost.mp3');
    ghostAudio.loop    = true;
    ghostAudio.preload = 'auto';
    ghostAudio.volume  = 0;
  }
  // play() exige um gesto do usuário; já estamos dentro de um (keydown). Ignora bloqueio de autoplay.
  ghostAudio.play().catch(() => {});

  // --- Morcego: guincho agudo com tremolo rápido + vibrato (chiado/batimento de asas) ---
  if (batProxGain) return;            // já criado: evita empilhar osciladores a cada nível
  const bOsc  = audioCtx.createOscillator();
  const bFlt  = audioCtx.createBiquadFilter();
  const bAmp  = audioCtx.createGain();
  const bTrem = audioCtx.createOscillator();
  const bTremG= audioCtx.createGain();
  const bVib  = audioCtx.createOscillator();   // vibrato leve → guincho soa mais orgânico
  const bVibG = audioCtx.createGain();
  const bGain = audioCtx.createGain();

  // Guincho menos estridente: frequência mais baixa, tremolo mais suave (item C25)
  bOsc.type = 'triangle'; bOsc.frequency.setValueAtTime(1500, audioCtx.currentTime);
  bVib.frequency.setValueAtTime(6, audioCtx.currentTime); bVibG.gain.setValueAtTime(80, audioCtx.currentTime);
  bVib.connect(bVibG); bVibG.connect(bOsc.frequency);
  bFlt.type = 'bandpass'; bFlt.frequency.setValueAtTime(1600, audioCtx.currentTime); bFlt.Q.setValueAtTime(2, audioCtx.currentTime);
  bAmp.gain.setValueAtTime(1, audioCtx.currentTime);
  bTrem.type = 'sine'; bTrem.frequency.setValueAtTime(14, audioCtx.currentTime); // batimento de asas mais lento
  bTremG.gain.setValueAtTime(0.7, audioCtx.currentTime);
  bTrem.connect(bTremG); bTremG.connect(bAmp.gain); // amplitude modulation = efeito de clique
  bGain.gain.setValueAtTime(0, audioCtx.currentTime);   // começa em silêncio; só sobe por proximidade (item C29)

  bOsc.connect(bFlt); bFlt.connect(bAmp); bAmp.connect(bGain); bGain.connect(masterGain);
  bOsc.start(); bTrem.start(); bVib.start();
  batProxGain = bGain;
}

function updateProximitySounds() {
  if (!audioStarted) return;
  let minGhost = Infinity, minBat = Infinity;
  const px = player.x + player.w / 2, py = player.y + player.h / 2;

  for (const e of enemies) {
    if (!e.alive) continue;
    const dx = px - (e.x + (e.w || 0) / 2);
    const dy = py - (e.y + (e.h || 0) / 2);
    const dist = Math.sqrt(dx * dx + dy * dy);
    if (e instanceof Ghost)    minGhost = Math.min(minGhost, dist);
    else if (e instanceof Bat) minBat   = Math.min(minBat,   dist);
    // Shade não emite som de proximidade (silenciosa por design)
  }

  const gVol = minGhost < PROX_RANGE ? (1 - minGhost / PROX_RANGE) * GHOST_MAX_VOL : 0;
  const bVol = minBat   < PROX_RANGE ? (1 - minBat   / PROX_RANGE) * 0.06 : 0;
  // O elemento Audio não tem ramps; suavizamos o volume manualmente para evitar "saltos".
  if (ghostAudio) {
    const v = ghostAudio.volume + (gVol - ghostAudio.volume) * 0.08;
    ghostAudio.volume = Math.max(0, Math.min(1, v));
  }
  if (batProxGain) batProxGain.gain.setTargetAtTime(bVol, audioCtx.currentTime, 0.15);
}

function stopLoops() {
  const t = audioCtx.currentTime;
  // Fade-out e PARADA REAL dos osciladores — antes eles só baixavam o volume e vazavam (itens C23/C28)
  if (droneGain) {
    const g = droneGain.gain.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(0.0001, t + 1.0);
    try { droneGain.osc.stop(t + 1.1); droneGain.osc2.stop(t + 1.1); droneGain.lfo.stop(t + 1.1); } catch (e) {}
    droneGain = null;
  }
  if (flameGain) {
    const g = flameGain.gain.gain;
    g.cancelScheduledValues(t); g.setValueAtTime(g.value, t);
    g.linearRampToValueAtTime(0.0001, t + 1.0);
    try { flameGain.src.stop(t + 1.1); flameGain.fLfo.stop(t + 1.1); } catch (e) {}
    flameGain = null;
  }
  if (ghostAudio)  { ghostAudio.volume = 0; ghostAudio.pause(); }
  if (batProxGain) { batProxGain.gain.setTargetAtTime(0, t, 0.3); }
}

function playStep() {
  const now  = audioCtx.currentTime;
  // Componente de ruído (atrito do pé com o chão de pedra)
  const src  = audioCtx.createBufferSource();
  src.buffer = createNoiseBuffer(0.15);
  const flt  = audioCtx.createBiquadFilter();
  flt.type   = 'lowpass';
  flt.frequency.setValueAtTime(260, now);
  const gain = audioCtx.createGain();
  gain.gain.setValueAtTime(0.18, now);
  gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
  src.connect(flt); flt.connect(gain); gain.connect(masterGain);
  src.start(now); src.stop(now + 0.15);

  // Baque grave curto (peso da pisada) — varia de tom para não soar repetitivo
  const thump = audioCtx.createOscillator();
  const tg    = audioCtx.createGain();
  thump.type  = 'sine';
  const base  = 95 + Math.random() * 20;
  thump.frequency.setValueAtTime(base, now);
  thump.frequency.exponentialRampToValueAtTime(base * 0.55, now + 0.09);
  tg.gain.setValueAtTime(0.16, now);
  tg.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
  thump.connect(tg); tg.connect(masterGain);
  thump.start(now); thump.stop(now + 0.12);
}

  // Impacto grave (a pancada do golpe)

// Desbloqueia AudioContext no primeiro input (política de autoplay dos browsers)
window.addEventListener('keydown', function startAudio() {
  audioCtx.resume().then(() => {
    if (!audioStarted) {
      audioStarted = true;
      startDrone();
      startFlame();
      initProximityAudio();
      window.removeEventListener('keydown', startAudio);
    }
  });
});

// ── Sistema de iluminação (Canvas 2D – destination-out) ───────────────────────
const lightCvs = document.createElement('canvas');
lightCvs.width = SW; lightCvs.height = SH;
const lctx = lightCvs.getContext('2d');

function applyLight(ctx, lights) {
  // 1. Cobertura de escuridão
  lctx.globalCompositeOperation = 'source-over';
  lctx.fillStyle = 'rgba(0,0,0,0.93)';
  lctx.fillRect(0, 0, SW, SH);

  // 2. Perfura a escuridão para cada fonte de luz (destination-out)
  lctx.globalCompositeOperation = 'destination-out';
  for (const L of lights) {
    const hole = lctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.radius);
    hole.addColorStop(0,    'rgba(0,0,0,1)');
    hole.addColorStop(0.25, 'rgba(0,0,0,0.96)');
    hole.addColorStop(0.55, 'rgba(0,0,0,0.78)');
    hole.addColorStop(0.80, 'rgba(0,0,0,0.38)');
    hole.addColorStop(1.0,  'rgba(0,0,0,0)');
    lctx.fillStyle = hole;
    lctx.fillRect(0, 0, SW, SH);
  }

  // 3. Tonalidade laranja quente de cada fonte
  lctx.globalCompositeOperation = 'source-over';
  for (const L of lights) {
    const warm = lctx.createRadialGradient(L.x, L.y, 0, L.x, L.y, L.radius * 0.7);
    warm.addColorStop(0,   'rgba(255,145,30,0.22)');
    warm.addColorStop(0.5, 'rgba(255,95,10,0.12)');
    warm.addColorStop(1,   'rgba(255,60,0,0)');
    lctx.fillStyle = warm;
    lctx.fillRect(0, 0, SW, SH);
  }

  // 4. Aplica sobre o frame principal
  ctx.drawImage(lightCvs, 0, 0);
}

// ── Renderização do cenário ───────────────────────────────────────────────────
function drawBG(ctx, cx) {
  ctx.fillStyle = '#050210';
  ctx.fillRect(0, 0, SW, SH);

  // Pilares – parallax 0.18×
  const pi0 = Math.floor((cx * 0.18) / 185) - 1;
  for (let i = pi0; i <= pi0 + Math.ceil(SW / 185) + 3; i++) {
    const px = Math.floor(i * 185 - cx * 0.18);
    if (px < -35 || px > SW + 35) continue;
    ctx.fillStyle = '#0d0718';
    ctx.fillRect(px, 0, 30, SH);
    ctx.fillStyle = '#150c22';
    ctx.fillRect(px + 3, 0, 5, SH);
    ctx.fillStyle = '#0a0514';
    ctx.fillRect(px + 22, 0, 5, SH);
  }

  // Estalactites – parallax 0.44×
  const si0 = Math.floor((cx * 0.44) / 135) - 1;
  for (let i = si0; i <= si0 + Math.ceil(SW / 135) + 3; i++) {
    const px = Math.floor(i * 135 - cx * 0.44);
    if (px < -20 || px > SW + 20) continue;
    const h = 22 + (i * 47 + 11) % 52;
    ctx.fillStyle = '#111b0d';
    ctx.fillRect(px, 0, 8, h);
    ctx.beginPath();
    ctx.moveTo(px, h); ctx.lineTo(px + 8, h); ctx.lineTo(px + 4, h + 13);
    ctx.closePath(); ctx.fill();
  }

  // Caveiras – parallax 0.68×
  const sk0 = Math.floor((cx * 0.68) / 340) - 1;
  for (let i = sk0; i <= sk0 + Math.ceil(SW / 340) + 3; i++) {
    const px = Math.floor(i * 340 + 90 - cx * 0.68);
    if (px < -50 || px > SW + 50) continue;
    const py = SH - 30;
    ctx.fillStyle = '#221430';
    ctx.beginPath(); ctx.arc(px, py, 15, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2e1c3e'; ctx.lineWidth = 1.5;
    ctx.beginPath(); ctx.arc(px, py, 15, 0, Math.PI * 2); ctx.stroke();
    ctx.fillStyle = '#050210';
    ctx.beginPath(); ctx.ellipse(px - 5, py - 4, 4, 5, 0, 0, Math.PI * 2); ctx.fill();
    ctx.beginPath(); ctx.ellipse(px + 5, py - 4, 4, 5, 0, 0, Math.PI * 2); ctx.fill();
    for (let t = 0; t < 4; t++) {
      ctx.fillRect(px - 7 + t * 5, py + 7, 4, 6);
    }
  }
}

function drawPlatform(ctx, p, cx, cy) {
  const sx = p.x - cx, sy = p.y - cy;
  if (sx > SW + 10 || sx + p.w < -10) return;

  // Corpo
  ctx.fillStyle = '#1c0e2e';
  ctx.fillRect(sx, sy, p.w, p.h);
  // Topo
  ctx.fillStyle = '#37204e';
  ctx.fillRect(sx, sy, p.w, 7);
  // Borda de luz sutil no topo
  ctx.fillStyle = '#4a2d62';
  ctx.fillRect(sx, sy, p.w, 2);
  // Gretas de pedra
  ctx.strokeStyle = '#120820';
  ctx.lineWidth = 1;
  for (let dx = 0; dx < p.w; dx += 38) {
    ctx.beginPath(); ctx.moveTo(sx+dx, sy); ctx.lineTo(sx+dx, sy+p.h); ctx.stroke();
  }
  for (let dy = 0; dy < p.h; dy += 18) {
    ctx.beginPath(); ctx.moveTo(sx, sy+dy); ctx.lineTo(sx+p.w, sy+dy); ctx.stroke();
  }
  // Musgo
  ctx.fillStyle = '#182410';
  for (let dx = 6; dx < p.w - 6; dx += 24) {
    ctx.fillRect(sx + dx, sy, 6, 4 + (dx * 7) % 5);
  }
}

function drawWallTorch(ctx, wx, wy, cx, cy, tick) {
  const sx = Math.floor(wx - cx);
  const sy = Math.floor(wy - cy);
  if (sx < -20 || sx > SW + 20) return;

  // Suporte de metal
  ctx.fillStyle = '#3a2010';
  ctx.fillRect(sx - 2, sy, 4, 14);
  ctx.fillStyle = '#5a3a18';
  ctx.fillRect(sx - 4, sy - 3, 8, 6);

  // Chama pequena
  const w1 = Math.sin(tick * 0.31 + wx * 0.01) * 2;
  ctx.beginPath();
  ctx.moveTo(sx, sy - 3);
  ctx.lineTo(sx - 4 + w1, sy - 10);
  ctx.lineTo(sx, sy - 7);
  ctx.lineTo(sx + 4 + w1 * 0.5, sy - 10);
  ctx.closePath();
  ctx.fillStyle = '#ffca30';
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(sx, sy - 3);
  ctx.lineTo(sx - 1 + w1 * 0.5, sy - 7);
  ctx.lineTo(sx + 2, sy - 7);
  ctx.closePath();
  ctx.fillStyle = '#ff5500';
  ctx.fill();
}

function drawExitDoor(ctx, cx, cy, open) {
  const dx = EXIT.x - cx, dy = EXIT.y - cy;
  if (dx < -80 || dx > SW + 80) return;
  const locked = !open;

  // Moldura
  ctx.fillStyle = '#2e1840';
  ctx.fillRect(dx - 7, dy - 74, 56, 78);
  ctx.fillStyle = '#3e2455';
  ctx.fillRect(dx - 4, dy - 71, 50, 6);   // detalhe topo

  // Porta
  ctx.fillStyle = locked ? '#1e1e30' : '#52301a';
  ctx.fillRect(dx, dy - 65, 42, 69);

  // Painéis internos
  ctx.fillStyle = locked ? '#161628' : '#3a2010';
  ctx.fillRect(dx + 4, dy - 61, 15, 28);
  ctx.fillRect(dx + 23, dy - 61, 15, 28);
  ctx.fillRect(dx + 4, dy - 26, 34, 22);

  if (locked) {
    // Cadeado
    ctx.save();
    ctx.shadowColor = '#b89020';
    ctx.shadowBlur = 10;
    ctx.fillStyle = '#9e7a1e';
    ctx.beginPath(); ctx.arc(dx + 21, dy - 32, 9, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#7e5e14';
    ctx.fillRect(dx + 17, dy - 28, 8, 12);
    ctx.restore();

    // Texto
    ctx.fillStyle = '#d4a820';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'center';
    ctx.fillText(isBossLevel ? 'Derrote a Sombra' : `${player.keys} / ${TOTAL_KEYS} chaves`,
      dx + 21, dy - 84);
    ctx.textAlign = 'left';
  } else {
    // Brilho dourado
    ctx.save();
    ctx.shadowColor = '#ffe060';
    ctx.shadowBlur = 35;
    ctx.fillStyle = 'rgba(255,220,80,0.2)';
    ctx.beginPath(); ctx.arc(dx + 21, dy - 32, 22, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = '#fff8d0';
    ctx.beginPath(); ctx.arc(dx + 21, dy - 32, 7, 0, Math.PI * 2); ctx.fill();
    ctx.restore();
  }
}

function drawHUD(ctx, player) {
  // Corações com bezier
  for (let i = 0; i < 3; i++) {
    const hx = 16 + i * 36, hy = 20;
    ctx.fillStyle = i < player.hp ? '#c81414' : '#38181e';
    ctx.shadowColor = i < player.hp ? 'rgba(200,20,20,0.5)' : 'transparent';
    ctx.shadowBlur  = i < player.hp ? 8 : 0;
    ctx.beginPath();
    ctx.moveTo(hx + 10, hy);
    ctx.bezierCurveTo(hx + 10, hy - 9, hx,      hy - 9, hx,      hy);
    ctx.bezierCurveTo(hx,      hy + 7, hx + 10, hy + 15, hx + 10, hy + 15);
    ctx.bezierCurveTo(hx + 10, hy + 15, hx + 20, hy + 7, hx + 20, hy);
    ctx.bezierCurveTo(hx + 20, hy - 9, hx + 10, hy - 9, hx + 10, hy);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  // Medidor de combustível da tocha (em TODAS as fases — a tocha sempre decai) (item 12)
  {
    const fuel = player.torchFuel;
    const bw = 150, bh = 13, bx = SW - 16 - bw, by = 18;
    const low = fuel < 0.3;
    // Pisca quando crítica
    if (!low || Math.floor(globalTick / 8) % 2 === 0) {
      ctx.fillStyle = '#ffce38';
      ctx.font = 'bold 14px monospace';
      ctx.textAlign = 'right';
      ctx.fillText('TOCHA', bx - 8, by + 11);
    }
    ctx.textAlign = 'left';
    // Trilho
    ctx.fillStyle = 'rgba(0,0,0,0.55)';
    ctx.fillRect(bx - 2, by - 2, bw + 4, bh + 4);
    ctx.fillStyle = '#241208';
    ctx.fillRect(bx, by, bw, bh);
    // Preenchimento (laranja → vermelho conforme esvazia)
    const r = 255, g = (60 + 150 * fuel) | 0;
    ctx.fillStyle = `rgb(${r},${g},40)`;
    ctx.shadowColor = 'rgba(255,140,30,0.7)'; ctx.shadowBlur = low ? 0 : 8;
    ctx.fillRect(bx, by, bw * fuel, bh);
    ctx.shadowBlur = 0;
  }

  // Contador de chaves (logo abaixo da tocha; oculto na fase do boss)
  if (!isBossLevel) {
    ctx.fillStyle = '#ffd700';
    ctx.font = 'bold 18px monospace';
    ctx.textAlign = 'right';
    ctx.fillText(`Chaves: ${player.keys} / ${TOTAL_KEYS}`, SW - 16, 54);
    ctx.textAlign = 'left';
  }

  // Indicador de mudo (item C30)
  if (audioMuted) {
    ctx.fillStyle = 'rgba(200,200,210,0.85)';
    ctx.font = 'bold 13px monospace';
    ctx.textAlign = 'right';
    ctx.fillText('🔇 MUDO (M)', SW - 16, 74);
    ctx.textAlign = 'left';
  }

  // Dica contextual: perto de fogueira apagada com a tocha fraca demais (item A6)
  if (nearUnlitFire && state === 'playing') {
    ctx.globalAlpha = 0.95;
    ctx.fillStyle = '#ffce38';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 5;
    ctx.font = 'bold 15px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Sua tocha está fraca! Reacenda-a no fogo antes de acender a fogueira', SW / 2, SH - 44);
    ctx.textAlign = 'left';
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // Texto de TUTORIAL (mecânica): rodapé, roxo, prefixado por ▸ (item B17)
  if (currentTutorialText) {
    ctx.globalAlpha = 0.9;
    ctx.fillStyle = 'rgba(200,170,230,0.95)';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    ctx.font = '15px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('▸ ' + currentTutorialText, SW / 2, SH - 20);
    ctx.textAlign = 'left';
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }

  // NARRATIVA (pensamento/memória): painel central, itálico, com tarja — distinto do tutorial (itens B17/B18)
  if (storyAlpha > 0 && currentStoryText) {
    const a = Math.min(1, storyAlpha);
    const y = Math.max(96, SH / 4);
    ctx.font = 'italic 19px monospace';
    const tw = ctx.measureText(currentStoryText).width;
    ctx.globalAlpha = a * 0.5;
    ctx.fillStyle = '#000';
    ctx.fillRect(SW / 2 - tw / 2 - 18, y - 22, tw + 36, 34);   // tarja de leitura
    ctx.globalAlpha = a;
    ctx.fillStyle = '#e8dcff';
    ctx.shadowColor = '#000'; ctx.shadowBlur = 4;
    ctx.textAlign = 'center';
    ctx.fillText(currentStoryText, SW / 2, y);
    ctx.textAlign = 'left';
    ctx.shadowBlur = 0;
    ctx.globalAlpha = 1;
  }
}

// ── Estado do jogo ────────────────────────────────────────────────────────────
let player, enemies, gameKeys, gameHearts, sparks;
let campfires = null, boss = null;
let camX = 0, camY = 0;
let state = 'intro';           // 'intro' | 'playing' | 'bossIntro' | 'dead' | 'won'
let prevState = 'playing';
let flicker = 0, flickT = 0;
let jumpLast = false;
// Dois contadores distintos (item 30):
//  • globalTick — avança SÓ no estado 'playing'. Use para lógica de jogo (flicker, timers de som).
//  • frameCount — avança em TODOS os estados. Use para animação de overlays (vento, fades, intro).
let globalTick = 0;
let stepTimer = 0;
let frameCount = 0;

// Boss / Fase 3
let isBossLevel = false;
let bossDefeated = false;
let bossIntroT = 0;
let windTimer = 0;
let windFx = 0;

// Fade, intro e mensagens
let introT = 0;
let introStarting = false;
let fadeAlpha = 1, fadeTarget = 0;
const FADE_SPEED = 0.025;
let transition = null;         // função executada quando a tela fica totalmente preta
let levelTitleT = 0;
let banner = null;             // { text, t } – mensagem temporária

function startTransition(fn) { fadeTarget = 1; transition = fn; }

function updateFade() {
  if (fadeAlpha < fadeTarget)      fadeAlpha = Math.min(fadeTarget, fadeAlpha + FADE_SPEED);
  else if (fadeAlpha > fadeTarget) fadeAlpha = Math.max(fadeTarget, fadeAlpha - FADE_SPEED);
  if (transition && fadeAlpha >= 0.999) {
    const fn = transition; transition = null;
    fn();
    fadeTarget = 0;
  }
}

function spawnWind() { windFx = 80; }

function loadLevel(index) {
  currentLevelIndex = index;
  const lvl = LEVELS[index];
  WORLD_W = lvl.WORLD_W;
  WORLD_H = lvl.WORLD_H;
  PLATFORMS = lvl.PLATFORMS;
  KEY_DEFS = lvl.KEY_DEFS;
  TOTAL_KEYS = KEY_DEFS.length;
  HEART_DEFS = lvl.HEART_DEFS || [];
  ENEMY_DEFS = lvl.ENEMY_DEFS;
  WALL_TORCHES = lvl.WALL_TORCHES;
  EXIT = lvl.EXIT;
  STORY_ZONES = lvl.STORY_ZONES ? JSON.parse(JSON.stringify(lvl.STORY_ZONES)) : [];
  TUTORIAL_ZONES = lvl.TUTORIAL_ZONES ? JSON.parse(JSON.stringify(lvl.TUTORIAL_ZONES)) : [];
  currentStoryText = "";
  currentTutorialText = "";
  storyAlpha = 0;

  // Fase do boss
  isBossLevel = !!lvl.isBoss;
  bossDefeated = false;
  campfires = lvl.CAMPFIRES ? lvl.CAMPFIRES.map(c => new Campfire(c.x, c.y, c.reward)) : null;
  boss = lvl.BOSS ? new Boss(lvl.BOSS.x, lvl.BOSS.y) : null;

  // Fade-in e título da fase
  fadeAlpha = 1; fadeTarget = 0;
  levelTitleT = 0;
  banner = null;
  windFx = 0;
}

function resetLevel() {
  loadLevel(currentLevelIndex);
  player   = new Player(50, 490);
  enemies  = ENEMY_DEFS.map(d => {
    if (d.type === 'ghost') return new Ghost(d.x, d.y, d.patrol);
    if (d.type === 'shade') return new Shade(d.x, d.y, d.patrol);
    return new Bat(d.x, d.y, d.patrol);
  });
  gameKeys   = KEY_DEFS.map(k => new KeyItem(k.x, k.y, k.memory));
  gameHearts = HEART_DEFS.map(h => new Heart(h.x, h.y));
  sparks   = [];
  camX = 0; camY = 0;
  flicker = 0; flickT = 0;
  jumpLast = false;
  globalTick = 0;
  stepTimer = 0;
  if (audioStarted) { startDrone(); startFlame(); initProximityAudio(); }

  if (isBossLevel) {
    // Cena de entrada: o boss aparece, depois o vento apaga tudo
    state = 'bossIntro';
    bossIntroT = 0;
    windTimer = (rng(420, 660)) | 0;
    campfires.forEach(c => c.light());           // sala iluminada para a entrada
    player.cpx = 150; player.cpy = 540;          // checkpoint seguro na arena, junto ao refúgio (item 16)
    camX = clamp(boss.cx - SW / 2, 0, WORLD_W - SW);
    camY = clamp(boss.cy - SH / 2, -80, WORLD_H - SH);
    currentTutorialText = "";
  } else {
    state = 'playing';
  }

  // Ponte narrativa ao entrar numa fase nova (não em retry) (item B19)
  if (pendingOpening) {
    currentStoryText = pendingOpening;
    storyAlpha = 3.6;
    pendingOpening = null;
  }
  prevState = state;
}

function resetGame() {
  currentLevelIndex = 0;
  resetLevel();
}

// ── Loop de jogo ──────────────────────────────────────────────────────────────
function updateIntro() {
  introT++;
}

function updateBossIntro() {
  bossIntroT++;
  boss.t++;
  for (const cf of campfires) cf.update();
  for (const e of enemies) e.update(player);

  // Câmera apresentando o boss
  camX = lerp(camX, clamp(boss.cx - SW / 2, 0, WORLD_W - SW), 0.06);
  camY = lerp(camY, clamp(boss.cy - SH / 2, -80, WORLD_H - SH), 0.06);

  // O vento gélido varre a sala: apaga TODAS as fogueiras e quase apaga a tocha do herói (item 5).
  // Deixa o herói com chama mínima — o bastante para correr ao refúgio e reacender o fogo.
  if (bossIntroT === 110) {
    player.torchFuel = 0.35;
    for (const cf of campfires) cf.extinguish();
    spawnWind();
    if (audioStarted) playWind();
  }

  // Devolve o controle ao jogador
  if (bossIntroT > 235) {
    state = 'playing';
    prevState = 'playing';
    levelTitleT = 0;
    currentTutorialText = "Como você fez lá atrás: ACENDA as fogueiras com a tocha e encurrale a Sombra na luz.";
  }
}

function update() {
  if (state === 'intro')     { updateIntro();     return; }
  if (state === 'bossIntro') { updateBossIntro(); return; }
  if (state !== 'playing') return;
  globalTick++;
  levelTitleT++;

  const goL  = input['ArrowLeft']  || input['KeyA'];
  const goR  = input['ArrowRight'] || input['KeyD'];
  const jump = input['Space'] || input['ArrowUp'] || input['KeyW'];

  player.vx = goR ? MOVE_SPEED : goL ? -MOVE_SPEED : 0;
  if (goR) player.facing = 1;
  if (goL) player.facing = -1;
  if (jump && !jumpLast) player.jump();
  jumpLast = jump;

  const prevInv = player.inv;
  player.update(PLATFORMS);

  // Som de passos: ruído curto ao andar no chão
  stepTimer++;
  if (audioStarted && player.onGround && (goL || goR) && stepTimer % 22 === 0) {
    playStep();
  }

  for (const e of enemies) {
    e.update(player);   // Shade usa o player; Ghost/Bat ignoram o argumento
    if (e.alive && hits(player.rect, e.rect)) {
      const eCx = e.x + (e.w || 0) / 2;
      const dir = (player.x + player.w / 2) < eCx ? -1 : 1;   // empurra no sentido oposto ao inimigo
      player.hurt(dir);
    }
  }

  // Som de dano: dispara quando frames de inv são ativados
  if (audioStarted && player.inv > 0 && prevInv === 0) playHurt();

  for (const k of gameKeys) {
    if (!k.collected) {
      if (hits(player.rect, {x:k.x-12, y:k.y-12, w:30, h:30})) {
        k.collected = true;
        player.keys++;
        if (audioStarted) playKeyCollect();
        // Cada chave desperta um fragmento de memória — o fio condutor da história (itens B10/B11)
        if (k.memory) { currentStoryText = k.memory; storyAlpha = 3.4; }
      }
    }
  }

  // Corações: recuperam 1 de vida, até o máximo de 3 (item 17)
  for (const h of gameHearts) {
    if (!h.collected && player.hp < 3 && hits(player.rect, h.rect)) {
      h.collected = true;
      player.hp++;
      if (audioStarted) playKeyCollect();
    }
  }

  // Checkpoint: memoriza a última posição em chão firme e longe de inimigos (itens 15/20)
  if (player.onGround && player.vy >= 0) {
    let safe = true;
    for (const e of enemies) {
      if (!e.alive) continue;
      if (Math.abs((e.x + (e.w || 0) / 2) - (player.x + player.w / 2)) < 130 &&
          Math.abs(e.y - player.y) < 110) { safe = false; break; }
    }
    if (safe) { player.cpx = clamp(player.x, 0, WORLD_W - player.w); player.cpy = player.y; }
  }

  // ── Tocha do herói (TODAS as fases): decai com o tempo e reacende no fogo (itens 8/9) ──
  const ptx = player.x + player.w / 2 + player.facing * 16;
  const pty = player.y + 18;
  if (campfires) for (const cf of campfires) cf.update();

  // Está perto de uma fonte de fogo acesa? (tochas de parede ou fogueiras acesas)
  let nearFire = false;
  for (const wt of WALL_TORCHES) {
    if (Math.hypot(ptx - wt.x, pty - wt.y) < WALLTORCH_REFUEL_R) { nearFire = true; break; }
  }
  if (!nearFire && campfires) {
    for (const cf of campfires) {
      if (cf.lit && Math.hypot(ptx - cf.flameX, pty - cf.flameY) < FIRE_REFUEL_R) { nearFire = true; break; }
    }
  }
  if (nearFire) {
    const wasLow = player.torchFuel < 0.35;
    player.torchFuel = Math.min(1, player.torchFuel + 0.035);     // reacende rápido (~0.5s)
    if (wasLow && player.torchFuel >= 0.35 && audioStarted) playRelight();
  } else if (!bossDefeated) {
    player.torchFuel = Math.max(0, player.torchFuel - (isBossLevel ? TORCH_DRAIN : TORCH_DRAIN_NORMAL));
  }

  // ── Acender fogueiras apagadas (TODAS as fases): o verbo central, ensinado já na Fase 1 (itens A1/A3/A6) ──
  nearUnlitFire = false;
  if (campfires) {
    for (const cf of campfires) {
      if (cf.lit) continue;
      if (Math.hypot(ptx - cf.flameX, pty - cf.flameY) < FIRE_REFUEL_R) {
        if (player.torchFuel > 0.15) {
          if (cf.light()) {
            if (audioStarted) playRelight();
            // Recompensa: acender certas fogueiras solta um coração (item A3)
            if (cf.reward === 'heart' && !cf.rewardGiven) {
              cf.rewardGiven = true;
              gameHearts.push(new Heart(cf.x, cf.y - 50));
              banner = { text: "A chama revela algo...", t: 130 };
            }
          }
        } else {
          nearUnlitFire = true;   // tocha fraca demais: mostra dica contextual (item A6)
        }
      }
    }
  }

  // ── Vento & Boss (Fase 3) ──
  if (isBossLevel) {
    // Rajadas de vento gélido: apagam fogueiras ao acaso e quase apagam a tocha (itens 2/4)
    if (!bossDefeated && --windTimer <= 0) {
      spawnWind();
      if (audioStarted) playWind();
      let apagadas = 0;
      for (const cf of campfires) {
        if (cf.lit && Math.random() < 0.6) { cf.extinguish(); apagadas++; }
      }
      if (!nearFire) player.torchFuel = Math.min(player.torchFuel, 0.12);
      banner = { text: apagadas > 0
        ? "Um vento gélido apaga as fogueiras — reacenda-as!"
        : "Um vento gélido varre a sala!", t: 150 };
      windTimer = (rng(420, 720)) | 0;
    }

    if (boss) {
      const wasAlive = boss.alive;
      boss.update(player, campfires);
      if (boss.alive) {
        if (boss.inLight) {
          if (audioStarted && globalTick % 12 === 0) playBossHit();
          // Faíscas saltando do boss: feedback claro de que a luz o fere (item 18)
          if (Math.random() < 0.6) sparks.push(new Spark(boss.cx, boss.cy));
        }
        if (hits(player.rect, boss.rect)) {
          const dir = (player.x + player.w / 2) < boss.cx ? -1 : 1;
          player.hurt(dir);
        }
      } else if (wasAlive) {
        bossDefeated = true;
        player.torchFuel = 1;        // a ameaça acabou: a tocha volta a arder plena
        // Revelação no clímax: a Sombra era a própria escuridão do herói (itens B14/B15)
        banner = { text: "A SOMBRA: \"Você venceu... a si mesmo.\"", t: 300 };
        currentStoryText = "Eu me lembro agora. Eu era o guardião — e ela, o que neguei em mim.";
        storyAlpha = 4.0;
        currentTutorialText = "A porta se abriu — leve sua luz para fora deste pesadelo.";
        if (audioStarted) { stopLoops(); playBossDeath(); }
      }
    }
  }

  // Checa saída (no boss, só abre após derrotá-lo)
  const canExit = isBossLevel ? bossDefeated : (player.keys >= TOTAL_KEYS);
  if (canExit && hits(player.rect, {x:EXIT.x, y:EXIT.y-65, w:42, h:68})) {
    if (currentLevelIndex < LEVELS.length - 1) {
      currentLevelIndex++;
      pendingOpening = LEVELS[currentLevelIndex].opening || null;   // ponte narrativa entre atos (item B19)
      resetLevel();
      return;
    } else {
      state = 'won';
    }
  }
  if (player.dead) state = 'dead';

  // Tutorial: dicas posicionais
  for (let i = 0; i < TUTORIAL_ZONES.length; i++) {
    if (!TUTORIAL_ZONES[i].triggered && player.x > TUTORIAL_ZONES[i].triggerX) {
      TUTORIAL_ZONES[i].triggered = true;
      currentTutorialText = TUTORIAL_ZONES[i].text;
    }
  }

  // Narrativa sombria
  for (let i = 0; i < STORY_ZONES.length; i++) {
    if (!STORY_ZONES[i].triggered && player.x > STORY_ZONES[i].triggerX) {
      STORY_ZONES[i].triggered = true;
      currentStoryText = STORY_ZONES[i].text;
      storyAlpha = 3.0;
    }
  }
  if (storyAlpha > 0) {
    storyAlpha -= 0.008;
  }

  // Sons de transição de estado
  if (audioStarted && state !== prevState) {
    stopLoops();
    if (state === 'dead') playGameOver();
    if (state === 'won')  playWin();
    prevState = state;
  }

  // Som de proximidade com inimigos
  updateProximitySounds();

  // Faíscas
  if (Math.random() < 0.45) {
    sparks.push(new Spark(
      player.x + player.w / 2 + player.facing * 17,
      player.y + 14
    ));
  }
  sparks = sparks.filter(s => s.life > 0);
  for (const s of sparks) s.update();

  // Flicker
  flickT++;
  if (flickT % 4 === 0) flicker = ((Math.random() - 0.5) * 30) | 0;

  // Câmera com lerp
  camX = lerp(camX, player.x - SW / 2 + player.w / 2, 0.10);
  camY = lerp(camY, player.y - SH / 2 + player.h / 2, 0.10);
  camX = clamp(camX, 0, WORLD_W - SW);
  camY = clamp(camY, -80, WORLD_H - SH);
}

function draw(ctx) {
  if (state === 'intro') { drawIntro(ctx); drawFade(ctx); return; }

  drawBG(ctx, camX);

  for (const p of PLATFORMS) drawPlatform(ctx, p, camX, camY);

  // Tochas decorativas (antes da iluminação → afetadas pela escuridão)
  for (const wt of WALL_TORCHES) drawWallTorch(ctx, wt.x, wt.y, camX, camY, globalTick);

  // Fogueiras (Fase 3)
  if (campfires) for (const cf of campfires) cf.draw(ctx, camX, camY);

  drawExitDoor(ctx, camX, camY, isBossLevel ? bossDefeated : (player.keys >= TOTAL_KEYS));
  for (const k of gameKeys)   k.draw(ctx, camX, camY);
  for (const h of gameHearts) h.draw(ctx, camX, camY);
  for (const e of enemies)    e.draw(ctx, camX, camY);
  for (const s of sparks)   s.draw(ctx, camX, camY);

  if (boss) boss.draw(ctx, camX, camY);
  player.draw(ctx, camX, camY);

  // ── Iluminação ──────────────────────────────────────────────────────────────
  const tp = player.torchScreen(camX, camY);
  // O raio da tocha encolhe conforme o combustível baixa (fuel=1 → raio normal)
  const torchR = TORCH_R * (0.28 + 0.72 * player.torchFuel) + flicker;
  const lights = [{ x: tp.x, y: tp.y, radius: torchR }];
  // Mini-aura de cada tocha de parede
  for (const wt of WALL_TORCHES) {
    const wx = wt.x - camX, wy = wt.y - camY - 8;
    if (wx < -120 || wx > SW + 120) continue;
    lights.push({ x: wx, y: wy, radius: 110 });
  }
  // Luz das fogueiras acesas
  if (campfires) {
    for (const cf of campfires) {
      if (!cf.lit) continue;
      const fx = cf.flameX - camX, fy = cf.flameY - camY;
      if (fx < -200 || fx > SW + 200) continue;
      lights.push({ x: fx, y: fy, radius: cf.radius + flicker });
    }
  }
  applyLight(ctx, lights);

  // Efeito de vento por cima da escuridão
  drawWind(ctx);

  // HUD (acima de tudo)
  drawHUD(ctx, player);
  if (isBossLevel && boss && (boss.alive || boss.dieT < 80)) drawBossBar(ctx, boss);
  if (state === 'playing') drawLevelTitle(ctx);
  if (state === 'bossIntro') drawBossIntroText(ctx);
  drawBanner(ctx);

  // Overlay de estado
  if (state === 'dead' || state === 'won') {
    const color = state === 'dead' ? 'rgba(80,0,0,0.58)' : 'rgba(0,55,10,0.58)';
    ctx.fillStyle = color;
    ctx.fillRect(0, 0, SW, SH);

    ctx.textAlign = 'center';
    if (state === 'dead') {
      ctx.fillStyle = '#d01818';
      ctx.font = 'bold 68px monospace';
      ctx.fillText('VOCÊ MORREU', SW / 2, SH / 2 - 18);
      ctx.fillStyle = '#aa5050';
      ctx.font = '30px monospace';
      ctx.fillText('Pressione R para refazer esta fase', SW / 2, SH / 2 + 44);
    } else {
      ctx.fillStyle = '#44e060';
      ctx.font = 'bold 68px monospace';
      ctx.fillText('VOCÊ ESCAPOU!', SW / 2, SH / 2 - 48);
      ctx.fillStyle = '#9fe0b0';
      ctx.font = '22px monospace';
      ctx.fillText('Você enfim recorda: foi você quem a selou, há eras.',
        SW / 2, SH / 2);
      ctx.fillStyle = '#7fb89a';
      ctx.font = 'italic 19px monospace';
      ctx.fillText('Ao aceitar sua própria sombra, a masmorra se desfaz em luz.',
        SW / 2, SH / 2 + 30);
      ctx.fillStyle = '#70c880';
      ctx.font = '26px monospace';
      ctx.fillText('Pressione R para voltar ao início', SW / 2, SH / 2 + 72);
    }
    ctx.textAlign = 'left';
  }

  drawFade(ctx);
}

// ── Overlays: intro, fade, vento, banners, título e barra do boss ─────────────
function drawFade(ctx) {
  if (fadeAlpha <= 0) return;
  ctx.fillStyle = `rgba(0,0,0,${fadeAlpha})`;
  ctx.fillRect(0, 0, SW, SH);
}

function drawIntro(ctx) {
  ctx.fillStyle = '#000';
  ctx.fillRect(0, 0, SW, SH);

  ctx.textAlign = 'center';

  // Título
  const titleA = clamp((introT - 10) / 50, 0, 1);
  ctx.save();
  ctx.globalAlpha = titleA;
  ctx.fillStyle = '#b070e0';
  ctx.shadowColor = '#6a2a9a'; ctx.shadowBlur = 26;
  ctx.font = 'bold 52px monospace';
  ctx.fillText('DUNGEON OF SHADOWS', SW / 2, 130);
  ctx.restore();

  // Linhas de história surgindo progressivamente
  ctx.save();
  ctx.font = '19px monospace';
  for (let i = 0; i < INTRO_STORY.length; i++) {
    const start = 75 + i * 55;
    const a = clamp((introT - start) / 45, 0, 1);
    if (a <= 0) continue;
    ctx.globalAlpha = a * 0.92;
    ctx.fillStyle = '#c9b8e0';
    ctx.fillText(INTRO_STORY[i], SW / 2, 235 + i * 40);
  }
  ctx.restore();

  // Prompt piscante
  const allShown = introT > 75 + INTRO_STORY.length * 55 + 30;
  if (allShown && Math.floor(introT / 30) % 2 === 0) {
    ctx.fillStyle = '#ffd060';
    ctx.font = 'bold 20px monospace';
    ctx.fillText('Pressione ENTER para começar', SW / 2, SH - 55);
  }
  ctx.textAlign = 'left';
}

function drawWind(ctx) {
  if (windFx <= 0) return;
  const a = Math.min(1, windFx / 80) * 0.5;
  ctx.save();
  ctx.strokeStyle = `rgba(205,215,255,${a})`;
  ctx.lineWidth = 2;
  for (let i = 0; i < 18; i++) {
    const y = (i * 37 + (frameCount * 4) % 37) % SH;
    const x = SW + 120 - (frameCount * 16 + i * 90) % (SW + 260);
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x - 70 - (i % 3) * 18, y + 7);
    ctx.stroke();
  }
  ctx.restore();
}

function drawBanner(ctx) {
  if (!banner) return;
  const a = clamp(banner.t / 40, 0, 1);
  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = '#ffe9c0';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 8;
  ctx.font = 'bold 24px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(banner.text, SW / 2, 70);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawBossIntroText(ctx) {
  // A Sombra fala — e revela quem é o herói (itens B14/B15)
  let txt;
  if (bossIntroT < 110)      txt = "A SOMBRA: \"Enfim acordou, guardião...\"";
  else if (bossIntroT < 175) txt = "A SOMBRA: \"Você me selou aqui — e a si mesmo.\"";
  else                       txt = "A SOMBRA: \"Tente me apagar. Apague-se junto.\"";
  ctx.save();
  ctx.globalAlpha = 0.95;
  ctx.fillStyle = '#ffe9c0';
  ctx.shadowColor = '#000'; ctx.shadowBlur = 10;
  ctx.font = 'bold 27px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(txt, SW / 2, 88);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawLevelTitle(ctx) {
  const name = LEVELS[currentLevelIndex].name;
  if (!name || levelTitleT >= 180) return;
  let a = 1;
  if (levelTitleT < 30)       a = levelTitleT / 30;
  else if (levelTitleT > 140) a = (180 - levelTitleT) / 40;
  ctx.save();
  ctx.globalAlpha = clamp(a, 0, 1);
  ctx.fillStyle = '#c8a0f0';
  ctx.shadowColor = '#5a2a8a'; ctx.shadowBlur = 16;
  ctx.font = 'bold 30px monospace';
  ctx.textAlign = 'center';
  ctx.fillText(name, SW / 2, 64);
  ctx.restore();
  ctx.textAlign = 'left';
}

function drawBossBar(ctx, boss) {
  const bw = 460, bh = 16, bx = (SW - bw) / 2, by = 24;
  ctx.fillStyle = 'rgba(20,8,30,0.8)';
  ctx.fillRect(bx - 3, by - 3, bw + 6, bh + 6);
  ctx.fillStyle = '#2a0d18';
  ctx.fillRect(bx, by, bw, bh);
  const f = clamp(boss.hp / boss.maxHp, 0, 1);
  const grd = ctx.createLinearGradient(bx, 0, bx + bw, 0);
  grd.addColorStop(0, '#8a0030'); grd.addColorStop(1, '#ff2a55');
  ctx.fillStyle = grd;
  ctx.fillRect(bx, by, bw * f, bh);
  ctx.strokeStyle = '#5a1a2a'; ctx.lineWidth = 2;
  ctx.strokeRect(bx, by, bw, bh);
  ctx.fillStyle = '#e0a0b0'; ctx.font = 'bold 13px monospace'; ctx.textAlign = 'center';
  ctx.fillText('A SOMBRA', SW / 2, by + bh + 15);
  ctx.textAlign = 'left';
}

// ── Bootstrap ─────────────────────────────────────────────────────────────────
window.addEventListener('keydown', e => {
  // Mudo / liga som (item C30) — funciona em qualquer estado
  if (e.code === 'KeyM') { setMuted(!audioMuted); return; }
  // Começar o jogo a partir da história introdutória
  if (state === 'intro' && !introStarting &&
      (e.code === 'Enter' || e.code === 'NumpadEnter' || e.code === 'Space')) {
    introStarting = true;
    startTransition(() => { introStarting = false; resetGame(); });
    return;
  }
  // Reiniciar após morrer / vencer
  if (e.code === 'KeyR' && (state === 'dead' || state === 'won')) {
    if (state === 'dead') {
      startTransition(() => resetLevel());
    } else {
      startTransition(() => { state = 'intro'; introT = 0; });
    }
  }
});

const canvas = document.getElementById('game');
canvas.width  = SW;
canvas.height = SH;
const ctx = canvas.getContext('2d');

// Escalona o canvas para telas menores mantendo aspecto
function fitCanvas() {
  const scale = Math.min(window.innerWidth / SW, window.innerHeight / SH);
  canvas.style.width  = `${SW * scale}px`;
  canvas.style.height = `${SH * scale}px`;
}
fitCanvas();
window.addEventListener('resize', fitCanvas);

// Inicia na história introdutória (tela preta + fade-in)
state = 'intro';
introT = 0;
fadeAlpha = 1; fadeTarget = 0;

(function loop() {
  frameCount++;
  updateFade();
  if (banner) { if (--banner.t <= 0) banner = null; }
  if (windFx > 0) windFx--;
  update();
  draw(ctx);
  requestAnimationFrame(loop);
})();
</script>
</body>
